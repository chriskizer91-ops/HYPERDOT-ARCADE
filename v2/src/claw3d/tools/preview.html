<!doctype html>
<meta charset="utf-8">
<title>Plush Panic 3D: plush preview</title>
<style>html,body{margin:0;height:100%;background:#120a1c;overflow:hidden}canvas{display:block}</style>
<!-- Dev tool: serve the repo root and open /v2/src/claw3d/tools/preview.html?id=fox&yaw=30
     It shows one plush from the models folder the way the game will light it. window.shot(id, yaw) re-poses it. -->
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
const q = new URLSearchParams(location.search);
const R = new THREE.WebGLRenderer({antialias: true});
R.setPixelRatio(1); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.0; R.outputColorSpace = THREE.SRGBColorSpace;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1c1028');
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .01, 50);
const pm = new THREE.PMREMGenerator(R);
new THREE.TextureLoader().load('../art/extra/reflect.webp', t => { t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace; scene.environment = pm.fromEquirectangular(t).texture; scene.environmentIntensity = .35; });
const key = new THREE.DirectionalLight('#fff1dc', 2.2); key.position.set(1.2, 2.5, 2); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = key.shadow.camera.bottom = -1; key.shadow.camera.right = key.shadow.camera.top = 1; key.shadow.bias = -.0005; scene.add(key);
const rim = new THREE.DirectionalLight('#ff7ad0', 1.6); rim.position.set(-2, 1.2, -1.5); scene.add(rim);
const fill = new THREE.HemisphereLight('#c9d6ff', '#3a2040', .9); scene.add(fill);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({color: '#2a1838', roughness: .95}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

/* the model format written by build_plush.py */
export function decodePlush(buf) {
  const dv = new DataView(buf), nv = dv.getUint32(4, true), nt = dv.getUint32(8, true), np = dv.getUint32(12, true);
  const mn = [0, 1, 2].map(i => dv.getFloat32(16 + i * 4, true)), mx = [0, 1, 2].map(i => dv.getFloat32(28 + i * 4, true));
  let o = 40; const take = (C, n, bytes) => { const a = new C(buf.slice(o, o + n * bytes)); o += n * bytes; return a; };
  const qp = take(Uint16Array, nv * 3, 2), n8 = take(Int8Array, nv * 3, 1), quv = take(Uint16Array, nv * 2, 2);
  const bone = take(Uint8Array, nv * 4, 1), wt = take(Uint8Array, nv * 4, 1), idx = take(Uint16Array, nt * 3, 2), part = take(Float32Array, np * 4, 4);
  const pos = new Float32Array(nv * 3), nrm = new Float32Array(nv * 3), uv = new Float32Array(nv * 2);
  for (let i = 0; i < nv; i++) for (let k = 0; k < 3; k++) { pos[i * 3 + k] = mn[k] + qp[i * 3 + k] / 65535 * (mx[k] - mn[k]); nrm[i * 3 + k] = n8[i * 3 + k] / 127; }
  for (let i = 0; i < nv * 2; i++) uv[i] = quv[i] / 65535;
  return {nv, nt, np, pos, nrm, uv, bone, wt, idx, part};
}
let current = null;
async function show(id, yaw = 0, pitch = 8) {
  const [buf, tex] = await Promise.all([fetch('../models/' + id + '.bin').then(r => r.arrayBuffer()), new THREE.TextureLoader().loadAsync('../models/' + id + '.webp')]);
  tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = false; tex.anisotropy = 8;
  const m = decodePlush(buf), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(m.pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(m.nrm, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(m.uv, 2)); g.setIndex(new THREE.BufferAttribute(m.idx, 1));
  const mat = q.get('plain') ? new THREE.MeshStandardMaterial({color: '#bbbbbb', roughness: .8}) : new THREE.MeshPhysicalMaterial({map: tex, roughness: .92, metalness: 0, sheen: 1, sheenRoughness: .45, sheenColor: new THREE.Color('#ffffff').multiplyScalar(.55)});
  if (current) { scene.remove(current); current.geometry.dispose(); }
  current = new THREE.Mesh(g, mat); current.castShadow = true; current.receiveShadow = !q.get('noself'); scene.add(current);
  current.rotation.y = yaw * Math.PI / 180;
  const h = 1, r = 1.9 + Math.max(0, (m.pos.reduce((a, v, i) => i % 3 === 2 ? Math.max(a, Math.abs(v)) : a, 0) - .5));
  const p = pitch * Math.PI / 180; cam.position.set(0, h * .5 + Math.sin(p) * r * 1.4, Math.cos(p) * r * 1.4); cam.lookAt(0, h * .47, 0);
  R.render(scene, cam); return {nv: m.nv, nt: m.nt, np: m.np};
}
window.shot = show;
window.parts = async id => { const m = decodePlush(await fetch('../models/' + id + '.bin').then(r => r.arrayBuffer())); return Array.from(m.part); };
show(q.get('id') || 'fox', +(q.get('yaw') || 0)).then(() => document.title = 'ready');
</script>
