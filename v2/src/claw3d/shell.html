<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plush Panic 3D</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* PLUSH PANIC 3D — Hyperdot Arcade. Three new claw machines in three.js; the HUD is LED dots. */
:root{--bg:#07060b;--ink:#efeaf6;--ink-2:#a39cb4;--accent:#ffb040;--accent-2:#4fe3ff;--pink:#ff5ab4;
  --panel:rgba(18,15,24,.78);--edge:rgba(255,255,255,.14);--f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{font:700 13px/1 var(--f);letter-spacing:.3em;color:var(--accent);text-shadow:0 0 12px rgba(255,176,64,.55);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(6px)}
.chip.on{border-color:rgba(79,227,255,.7);color:#bff6ff;box-shadow:0 0 12px rgba(79,227,255,.35) inset}
.chip:focus-visible,.mb:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
@media (max-width:560px){.brand span{display:none}#snd{display:none}}
/* phones and the arcade: one small pause button in the bottom-right corner; the menu holds the rest */
body.touch .bar{display:none}
#pz{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;padding:0;display:none;
  border:1px solid var(--edge);background:var(--panel);color:var(--ink);font:700 12px/1 var(--f);letter-spacing:.05em;cursor:pointer;opacity:.75}
body.touch #pz{display:grid;place-items:center}
body.embed .bar,body.embed .keys{display:none!important}
body.embed #pz{display:grid;place-items:center}
body.embed:not(.touch) #pz{opacity:.35}
.keys{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 11px/1.5 var(--f);letter-spacing:.08em;color:var(--ink-2);pointer-events:none;
  text-shadow:0 0 6px #000,0 0 2px #000}
.keys b{color:var(--ink);font-weight:600}
body.touch .keys{display:none}
body.paused .keys,body.playing .keys{opacity:0}
.keys{transition:opacity .4s}
/* the pause menu */
#menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,3,12,.62);backdrop-filter:blur(3px);z-index:5}
#menu .card{min-width:240px;max-width:86vw;padding:22px 20px 16px;border-radius:18px;border:1px solid var(--edge);background:rgba(16,12,26,.92);box-shadow:0 0 40px rgba(255,90,180,.18);text-align:center}
#menu h2{margin:0 0 14px;font:700 20px/1 var(--f);letter-spacing:.3em;color:#fff;text-shadow:0 0 14px var(--pink)}
.mb{display:block;width:100%;margin:8px 0 0;height:42px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.05);color:var(--ink);
  font:600 12px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.mb.big{background:linear-gradient(90deg,rgba(255,90,180,.35),rgba(79,227,255,.3));border-color:rgba(255,255,255,.3)}
.mb.sm{display:inline-block;width:auto;padding:0 12px;height:34px;font-size:10px;margin:8px 3px 0}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* GO (hold to travel) and DROP, for touch, only while playing */
.tb{position:fixed;display:none;place-items:center;border-radius:50%;border:2px solid rgba(255,255,255,.22);color:#fff;font:700 15px/1 var(--f);letter-spacing:.12em;
  touch-action:none;-webkit-user-select:none;user-select:none;backdrop-filter:blur(4px)}
#bGo{right:max(18px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));width:96px;height:96px;background:radial-gradient(circle at 40% 35%,rgba(255,196,90,.55),rgba(200,110,20,.35));box-shadow:0 0 24px rgba(255,170,60,.35)}
#bDrop{right:max(128px,calc(env(safe-area-inset-right,0px) + 110px));bottom:max(30px,env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:12px;background:radial-gradient(circle at 40% 35%,rgba(90,220,255,.45),rgba(30,110,200,.3))}
.tb.on{transform:scale(.94);filter:brightness(1.35)}
body.touch.playing .tb{display:grid}
body.touch.playing #pz{left:max(12px,env(safe-area-inset-left,0px));right:auto;bottom:max(30px,env(safe-area-inset-bottom,0px))}
body.playing.paused .tb{display:none}
/* the machine picker's arrows, on the title screen only */
.pk{position:fixed;top:44%;width:46px;height:64px;margin-top:-32px;border-radius:14px;border:1px solid var(--edge);background:rgba(16,12,26,.55);color:#fff;
  font:400 40px/1 var(--f);display:none;place-items:center;cursor:pointer;backdrop-filter:blur(4px);touch-action:none;padding:0 0 6px}
#pL{left:max(8px,env(safe-area-inset-left,0px))}#pR{right:max(8px,env(safe-area-inset-right,0px))}
body.title .pk{display:grid}.pk.off{opacity:.18;pointer-events:none}
body.paused .pk{display:none}
/* the collection: a button on the title screen, and its screen */
#cB{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));height:40px;padding:0 12px 0 10px;border-radius:20px;
  border:1px solid var(--edge);background:var(--panel);color:#ffd040;font:700 12px/1 var(--f);letter-spacing:.08em;display:none;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(6px)}
#cB b{font-size:17px;line-height:1}#cB i{font-style:normal;color:var(--ink)}
#cB.fresh{box-shadow:0 0 14px rgba(255,208,64,.55);border-color:rgba(255,208,64,.7)}
body.title #cB{display:flex}body.coll #cB,body.paused #cB{display:none}
body.show .tb{display:none!important}
#coll{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(5,3,12,.7);backdrop-filter:blur(4px)}
#coll .cc{width:min(560px,94vw);max-height:92vh;overflow:auto;padding:14px 14px 16px;border-radius:18px;border:1px solid var(--edge);background:rgba(16,12,26,.95);box-shadow:0 0 40px rgba(255,208,64,.12)}
.chd{display:flex;align-items:center;gap:10px;margin:0 2px 6px}
.chd b{font:700 17px/1 var(--f);letter-spacing:.24em;color:#fff}.chd span{flex:1;font:600 13px/1 var(--f);color:#ffd040;letter-spacing:.1em}
#cX{width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:#fff;font-size:15px;cursor:pointer}
.cs h3{margin:12px 2px 6px;font:700 12px/1 var(--f);letter-spacing:.18em}.cs h3 i{font-style:normal;color:var(--ink-2);margin-left:6px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cell{position:relative;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);padding:4px 3px 6px;text-align:center}
.cell img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.cell span{display:block;font:700 9.5px/1.15 var(--f);letter-spacing:.06em;color:var(--ink-2);margin-top:2px;min-height:11px}
.cell em{display:block;font:600 9px/1 var(--f);font-style:normal;color:#8a82a0;margin-top:3px;min-height:9px}
.cell.got{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}.cell.got span{color:#fff}.cell.got em{color:#ffd040}
.cell.jack{border-color:rgba(255,208,64,.45)}
.cell.new::after{content:'NEW';position:absolute;top:4px;right:4px;padding:2px 5px;border-radius:6px;background:#6aff5a;color:#08200a;font:700 8.5px/1 var(--f);letter-spacing:.08em}
#ld{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 45%,#2a1606,#07060b);transition:opacity .5s;z-index:8;text-align:center}
#ld.gone{opacity:0;pointer-events:none}
#ld b{display:block;font:700 22px/1.1 var(--f);letter-spacing:.24em;color:#fff;text-shadow:0 0 14px #ff6ac0}
#ld span{display:block;margin-top:10px;font:500 11px/1.4 var(--f);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2)}
#ld i{display:block;width:200px;height:3px;margin:16px auto 0;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#ldb{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6ac0,#ffd040);transition:width .2s}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Plush Panic 3D"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="sa" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)"></div>
<div class="bar">
  <span class="brand">PLUSH PANIC 3D<span>HYPERDOT ARCADE</span></span>
  <div class="opts"><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<button id="pz" type="button" aria-label="Pause">II</button>
<button id="cB" type="button" aria-label="Your collection"><b>&#9733;</b><i>0/20</i></button>
<button class="pk" id="pL" type="button" aria-label="Previous machine">&#8249;</button>
<button class="pk" id="pR" type="button" aria-label="Next machine">&#8250;</button>
<button class="tb" id="bDrop" type="button" aria-label="Drop the claw now">DROP</button>
<button class="tb" id="bGo" type="button" aria-label="Hold to move the claw, let go to set">GO</button>
<div id="menu" hidden><div class="card">
  <h2>PAUSED</h2>
  <button class="mb big" id="mRes" type="button">Resume</button>
  <button class="mb" id="mRe" type="button">New game</button>
  <button class="mb" id="mMach" type="button">Pick a machine</button>
  <button class="mb" id="mColl" type="button">Collection</button>
  <div><button class="mb sm" id="mQ" type="button">Graphics: auto</button><button class="mb sm" id="mSnd" type="button">Sound: on</button></div>
  <button class="mb" id="mEx" type="button">Exit to arcade</button>
</div></div>
<div id="coll" hidden><div class="cc">
  <div class="chd"><b>COLLECTION</b><span id="cN">0 / 20</span><button id="cX" type="button" aria-label="Close">&#10005;</button></div>
  <div id="cG"></div>
</div></div>
<div id="ld"><div><b>PLUSH PANIC 3D</b><span>Filling the machine</span><i><em id="ldb"></em></i></div></div>
<p class="keys" id="keys"></p>
<div id="err">This game needs WebGL2, which this browser has turned off.</div>

</body>
</html>
