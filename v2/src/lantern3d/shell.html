<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lantern 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* =====================================================================================
   LANTERN 3D — the Hyperdot Arcade's Lantern, walked in three dimensions.
   One self-contained page: the town is drawn in WebGL2, the HUD is an amber dot matrix over it.
   Everything visual is drawn by code; all sound is synthesized. Dark-only by design.
   ===================================================================================== */
:root{
  --bg:#050302;--ink:#f8ebe0;--ink-2:#b09a8a;--accent:#ff8a2a;--accent-2:#ffd59a;
  --panel:rgba(26,14,8,.78);--edge:rgba(255,255,255,.14);
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;pointer-events:none;
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.opts{display:flex;gap:8px;margin-top:calc(var(--hudtop,0px))}
.chip{pointer-events:auto;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 10px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.82}
.chip:hover{opacity:1}
.chip:focus-visible,.ab:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
@media (max-width:440px){.opts{gap:6px}.chip{padding:0 9px;font-size:9px;letter-spacing:.06em}}
@media (max-width:330px){.chip .lbl{display:none}}
/* touch controls: a stick on the left, two buttons on the right */
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.stk{pointer-events:auto;touch-action:none;position:relative;flex:none;width:var(--stick,150px);height:var(--stick,150px);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0 30%,transparent 31%),rgba(26,14,8,.5);border:1px solid var(--edge)}
.kn{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:radial-gradient(circle at 40% 32%,#ffe0b0,#d0601a 62%,#4a1606);box-shadow:0 0 16px rgba(255,138,48,.45)}
.acts{pointer-events:auto;display:flex;gap:12px;align-items:flex-end}
.ab{touch-action:none;cursor:pointer;width:var(--b,64px);height:var(--b,64px);border-radius:50%;border:1px solid var(--edge);color:var(--ink);background:rgba(26,14,8,.55);
  font:700 11px/1 var(--f);letter-spacing:.06em;display:grid;place-items:center;padding:0;transition:transform .05s}
#bA{border-color:rgba(255,150,60,.75);background:radial-gradient(circle at 50% 34%,rgba(255,150,60,.5),rgba(26,14,8,.55) 74%);width:calc(var(--b,64px)*1.25);height:calc(var(--b,64px)*1.25)}
#bB{border-color:rgba(255,224,170,.6);background:radial-gradient(circle at 50% 34%,rgba(255,224,170,.3),rgba(26,14,8,.55) 74%)}
.ab.on{transform:scale(.9);filter:brightness(1.5)}
body.land #pad{opacity:.85}
.keys{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 11px/1.5 var(--f);letter-spacing:.08em;color:var(--ink-2);pointer-events:none;opacity:.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-shadow:0 1px 3px #000}
.keys b{color:var(--ink);font-weight:600}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
/* inside the 3D arcade: no page chrome */
body.embed .bar,body.embed .keys{display:none!important}
</style>
</head>
<body>
<canvas id="gl" aria-label="Lantern 3D: a lamplighter walks a town at night and keeps the shades at bay with a lantern beam"></canvas>
<div class="bar">
  <div class="opts"><button class="chip" id="res" type="button"><span class="lbl">Dots </span><span id="resv">OFF</span></button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<div id="pad" hidden>
  <div class="stk" id="stL" aria-label="Stick"><div class="kn" id="knL"></div></div>
  <div class="acts"><button class="ab" id="bB" type="button">FLARE</button><button class="ab" id="bA" type="button">BEAM</button></div>
</div>
<p class="keys" id="keys"><b>WASD</b> walk · <b>mouse</b> aims · hold <b>click</b> or <b>Space</b> for the beam · <b>right click</b> or <b>X</b> flare · <b>G</b> dots · <b>Esc</b> pause · <b>M</b> mute</p>
<div id="err">LANTERN 3D draws its town with WebGL2, which this browser has turned off.</div>
<script>
(()=>{
'use strict';
/*@@CODE@@*/
})();
</script>
</body>
</html>
