<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Air Hockey 3D</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&display=swap">
<style>
/* AIR HOCKEY 3D — Hyperdot Arcade. Full-resolution 3D in three.js; the HUD and the scoreboard are
   LED dots. Dark-only by design (it is a blacklit arcade). */
:root{--bg:#07060b;--ink:#efeaf6;--ink-2:#a39cb4;--p1:#2fd8ff;--p2:#ff2f8a;--gold:#ffd23f;
  --panel:rgba(18,15,24,.8);--edge:rgba(255,255,255,.14);--f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--f)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;z-index:3;
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{font:700 13px/1 var(--f);letter-spacing:.3em;color:var(--p1);text-shadow:0 0 12px rgba(47,216,255,.55);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(6px)}
.chip.on{border-color:rgba(47,216,255,.7);color:#bff6ff}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.inmenu #pauseBtn{display:none}
body.touch .bar{display:none}
#pz{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;padding:0;display:none;z-index:3;
  border:1px solid var(--edge);background:var(--panel);color:var(--ink);font:700 12px/1 var(--f);letter-spacing:.05em;cursor:pointer;opacity:.7}
body.touch #pz,body.embed #pz{display:grid;place-items:center}
body.embed .bar{display:none!important}
body.embed:not(.touch) #pz{opacity:.35}
body.inmenu #pz{display:none!important}

/* ---------- menus over the live table ---------- */
.scr{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;pointer-events:none;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scr>*{pointer-events:auto}
.mb{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:14px;border:1px solid var(--edge);background:rgba(16,12,26,.86);color:var(--ink);
  font:700 13px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:border-color .15s,transform .1s}
.mb:hover{border-color:rgba(255,255,255,.4)}.mb:active{transform:scale(.97)}
.mb.big{min-height:56px;font-size:16px;background:linear-gradient(100deg,rgba(47,216,255,.32),rgba(255,47,138,.32));border-color:rgba(255,255,255,.32);box-shadow:0 0 24px rgba(255,47,138,.18)}
/* the title */
#sTitle{justify-content:space-between;background:linear-gradient(to top,rgba(6,4,12,.92) 0,rgba(6,4,12,.55) 34%,rgba(6,4,12,0) 58%),linear-gradient(to bottom,rgba(6,4,12,.6),rgba(6,4,12,0) 26%)}
.logo{margin-top:clamp(10px,4vh,48px);text-align:center;line-height:.86;pointer-events:none}
.logo b{display:inline-block;margin:0 .14em;font:italic 700 clamp(46px,9vw,84px)/.95 var(--f);letter-spacing:.04em;color:#fff;
  text-shadow:0 0 6px #fff,0 0 18px var(--p2),0 0 44px var(--p2),0 0 80px rgba(255,47,138,.5)}
.logo b+b{color:#eafcff;text-shadow:0 0 6px #fff,0 0 18px var(--p1),0 0 44px var(--p1),0 0 80px rgba(47,216,255,.5)}
.logo small{display:block;margin-top:12px;font:600 clamp(11px,2.6vw,14px)/1 var(--f);letter-spacing:.4em;color:var(--ink-2)}
.panel{width:min(560px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.opt>span{font:600 10px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.seg{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:rgba(10,8,18,.8)}
.seg button{flex:1;min-height:38px;border:0;background:transparent;color:var(--ink-2);font:600 12px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:0 4px}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:rgba(255,210,63,.16);color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.hint{margin:0;text-align:center;font:500 12px/1.45 var(--f);color:var(--ink-2)}
@media (max-aspect-ratio:1/1){.logo b{display:block;font-size:clamp(52px,16vw,96px)}}
@media (max-width:420px){.setts{grid-template-columns:1fr}.opt{flex-direction:row;align-items:center}.opt>span{width:72px;text-align:left}.seg{flex:1}}
@media (max-height:520px){.logo{margin-top:6px}.logo b{font-size:clamp(34px,9vh,64px)}.logo small{margin-top:6px}.panel{gap:8px}.mb.big{min-height:46px}}
/* the rivals */
#sRivals{justify-content:center;gap:14px;background:rgba(6,4,12,.72);backdrop-filter:blur(2px)}
#sRivals h2,#sOver h2{margin:0;font:italic 700 clamp(24px,6vw,34px)/1 var(--f);letter-spacing:.12em;text-transform:uppercase;text-align:center}
#cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(1040px,100%);max-height:calc(100% - 130px);overflow:auto;padding:4px}
.card{--c:#fff;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:170px;padding:16px 14px 14px;border-radius:16px;
  border:1px solid var(--edge);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(10,8,18,.92) 60%);color:var(--ink);cursor:pointer;overflow:hidden}
.card i{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);box-shadow:0 0 16px var(--c)}
.card b{font:italic 700 26px/1 var(--f);letter-spacing:.08em;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.card em{font:600 10px/1 var(--f);font-style:normal;letter-spacing:.24em;color:var(--ink)}
.card span{font:500 13px/1.4 var(--f);color:var(--ink-2)}
.card small{margin-top:auto;font:600 11px/1 var(--f);letter-spacing:.14em;color:var(--gold)}
.card:hover:not(.locked){border-color:var(--c)}
.card.locked{cursor:default;filter:grayscale(.85);opacity:.55}
.card.locked small{color:var(--ink-2)}
@media (max-width:860px){#cards{grid-template-columns:1fr 1fr}}
@media (max-width:520px){#cards{grid-template-columns:1fr;gap:8px}.card{min-height:0;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"b em" "s s" "sm sm";column-gap:12px;padding:12px 14px}
  .card b{grid-area:b;font-size:22px}.card em{grid-area:em;align-self:center}.card span{grid-area:s}.card small{grid-area:sm;margin-top:2px}}
/* the result */
#sOver{justify-content:center;background:radial-gradient(ellipse at center,rgba(6,4,12,.55),rgba(6,4,12,.88))}
.res{width:min(440px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;padding:20px 18px;border-radius:20px;border:1px solid var(--edge);background:rgba(14,10,24,.9);box-shadow:0 0 50px rgba(255,47,138,.16)}
#oT{--c:#fff;color:#fff;text-shadow:0 0 18px var(--c),0 0 40px var(--c)}
#oS{display:flex;justify-content:center;align-items:baseline;gap:16px;font:italic 700 64px/1 var(--f)}
#oS span{color:var(--ink-2);font-size:40px}
#oStats{display:grid;gap:4px;font:500 14px/1.3 var(--f)}
#oStats div{display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:center;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.03)}
#oStats div.hd{background:none;font:600 10px/1 var(--f);letter-spacing:.2em}
#oStats div.one{grid-template-columns:1.4fr 2fr}
#oStats span{text-align:left;color:var(--ink-2)}
#oTix{font:700 18px/1 var(--f);letter-spacing:.14em;color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.5)}
#oTix:empty,#oUnlock:empty{display:none}
#oUnlock{font:600 13px/1.4 var(--f);color:#7cff6a}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.btns .mb{flex:1 1 120px}
/* the pause menu */
#menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,3,12,.62);backdrop-filter:blur(3px);z-index:5}
#menu .box{min-width:250px;max-width:88vw;padding:22px 20px 16px;border-radius:18px;border:1px solid var(--edge);background:rgba(16,12,26,.94);box-shadow:0 0 40px rgba(255,47,138,.18);text-align:center}
#menu h2{margin:0 0 14px;font:700 20px/1 var(--f);letter-spacing:.3em;color:#fff;text-shadow:0 0 14px var(--p2)}
#menu .mb{display:flex;width:100%;margin:8px 0 0;min-height:42px}
#menu .mb.sm{display:inline-flex;width:auto;min-height:34px;padding:0 12px;font-size:10px;margin:8px 3px 0}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Air Hockey 3D"></canvas>
<div id="sa" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px)"></div>
<div class="bar">
  <span class="brand">AIR HOCKEY 3D<span>HYPERDOT ARCADE</span></span>
  <div class="opts"><button class="chip" id="dots" type="button" title="Show the 3D through LED dots">Dots</button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<button id="pz" type="button" aria-label="Pause">II</button>

<section class="scr" id="sTitle" hidden aria-label="Air Hockey 3D">
  <h1 class="logo"><b>AIR</b><b>HOCKEY</b><small>3D · HYPERDOT ARCADE</small></h1>
  <div class="panel">
    <div class="row2"><button class="mb big" id="b1p" type="button" data-focus>1 Player</button><button class="mb big" id="b2p" type="button">2 Players</button></div>
    <div class="setts">
      <div class="opt"><span>First to</span><div class="seg" data-k="to" role="group" aria-label="Goals to win"><button type="button" data-v="5">5</button><button type="button" data-v="7">7</button><button type="button" data-v="9">9</button></div></div>
      <div class="opt"><span>Rules</span><div class="seg" data-k="rules" role="group" aria-label="Rules"><button type="button" data-v="classic">Classic</button><button type="button" data-v="frenzy">Frenzy</button></div></div>
      <div class="opt"><span>Table</span><div class="seg" data-k="theme" role="group" aria-label="Table"><button type="button" data-v="classic">Classic</button><button type="button" data-v="neon">Neon</button></div></div>
    </div>
    <p class="hint" id="tHint"></p>
  </div>
</section>
<section class="scr" id="sRivals" hidden aria-label="Choose your rival">
  <h2>Choose your rival</h2>
  <div id="cards"></div>
  <button class="mb" id="bBack" type="button">Back</button>
</section>
<section class="scr" id="sOver" hidden aria-label="Result">
  <div class="res">
    <h2 id="oT">You win!</h2>
    <div id="oS"></div>
    <div id="oStats"></div>
    <div id="oTix"></div>
    <div id="oUnlock"></div>
    <div class="btns"><button class="mb big" id="oAgain" type="button" data-focus>Rematch</button><button class="mb big" id="oNext" type="button">Next rival</button></div>
    <div class="btns"><button class="mb" id="oMenu" type="button">Menu</button><button class="mb" id="oExit" type="button">Exit to arcade</button></div>
  </div>
</section>
<div id="menu" hidden><div class="box">
  <h2>PAUSED</h2>
  <button class="mb big" id="mRes" type="button">Resume</button>
  <button class="mb" id="mRe" type="button">Restart match</button>
  <button class="mb" id="mQuit" type="button">Quit to menu</button>
  <div><button class="mb sm" id="mTh" type="button">Table: classic</button><button class="mb sm" id="mQ" type="button">Graphics: auto</button><button class="mb sm" id="mDots" type="button">Dots: off</button><button class="mb sm" id="mSnd" type="button">Sound: on</button><button class="mb sm" id="mVo" type="button">Voice: on</button></div>
  <button class="mb" id="mEx" type="button">Exit to arcade</button>
</div></div>
<div id="err">This game needs WebGL2, which this browser has turned off.</div>

</body>
</html>
