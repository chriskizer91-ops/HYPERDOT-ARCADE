<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prisma 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =====================================================================================
   PRISMA 3D: the night pursuit, rebuilt as a real 3D city. One self-contained page.
   The game logic is the original Prisma's; the city, the vehicles and the look are new.
   The HUD is still drawn in dots (the nod to the LED matrix); everything else is full 3D.
   ===================================================================================== */
:root{--bg:#030208;--ink:#efeaf6;--ink-2:#a39cb4;--panel:rgba(10,8,20,.72);--edge:rgba(255,255,255,.16);color-scheme:dark;
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif}
[hidden]{display:none!important}
html{height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* one small pause button; sound, view and quality live in the pause menu */
#pauseBtn{position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;
  border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;padding:0;display:grid;place-items:center;touch-action:none}
#pauseBtn::before,#pauseBtn::after{content:"";display:block;position:absolute;top:13px;width:4px;height:14px;border-radius:1px;background:currentColor}
#pauseBtn::before{left:14px}#pauseBtn::after{right:14px}
#pauseBtn:focus-visible{outline:2px solid #4fe3ff;outline-offset:2px}
/* touch: the whole left side steers (the stick jumps to your thumb), two buttons on the right */
#pad{position:fixed;inset:0;pointer-events:none}
#zone{position:absolute;left:0;top:18%;bottom:0;width:46%;pointer-events:auto;touch-action:none}
.stk{position:absolute;width:var(--stick,140px);height:var(--stick,140px);margin:calc(var(--stick,140px)*-.5) 0 0 calc(var(--stick,140px)*-.5);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.06) 0 30%,transparent 31%),rgba(10,8,20,.42);border:1px solid var(--edge);transition:opacity .2s}
.kn{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:radial-gradient(circle at 40% 32%,#ffffff,#9fe9ff 40%,#3a6cff 75%,#2a1a7a);box-shadow:0 0 18px rgba(120,200,255,.55)}
.acts{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.ab{touch-action:none;cursor:pointer;width:var(--b,60px);height:var(--b,60px);border-radius:50%;border:1px solid var(--edge);color:var(--ink);background:rgba(10,8,20,.5);
  font:700 11px/1 var(--f);letter-spacing:.06em;display:grid;place-items:center;padding:0;transition:transform .05s;position:relative}
.ab::after{content:"";position:absolute;inset:-14px;border-radius:50%}   /* a bigger hit area than it looks */
#bA{border-color:rgba(160,220,255,.8);background:radial-gradient(circle at 50% 34%,rgba(130,210,255,.55),rgba(10,8,20,.5) 74%);width:calc(var(--b,60px)*1.3);height:calc(var(--b,60px)*1.3)}
#bB{border-color:rgba(255,110,140,.65);background:radial-gradient(circle at 50% 34%,rgba(255,90,120,.38),rgba(10,8,20,.5) 74%)}
.ab.on{transform:scale(.9);filter:brightness(1.6)}
#turn{position:fixed;left:0;right:0;bottom:22px;margin:0;text-align:center;font:600 12px/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
body.embed #pauseBtn{display:none}
</style>
</head>
<body>
<canvas id="gl" aria-label="Prisma 3D: a night pursuit through a neon city"></canvas>
<div id="sa"></div>
<button id="pauseBtn" type="button" aria-label="Pause"></button>
<div id="pad" hidden>
  <div id="zone" aria-label="Steer"><div class="stk" id="stL"><div class="kn" id="knL"></div></div></div>
  <div class="acts"><button class="ab" id="bB" type="button">BRAKE</button><button class="ab" id="bA" type="button">NITRO</button></div>
</div>
<p id="turn" hidden>Turn your phone sideways</p>
<div id="err">PRISMA 3D needs WebGL2, which this browser has turned off.</div>
<script>
(()=>{
'use strict';
/*@@CODE@@*/
})();
</script>
</body>
</html>
