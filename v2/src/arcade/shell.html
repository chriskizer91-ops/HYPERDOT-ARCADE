<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyperdot Arcade</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL arcade; thin HUD on top, contextual touch controls on the bottom corners. Single dark look by design. */
:root{
  --bg:#07060b;
  --ink:#f4ecff;
  --ink-2:#a99ec0;
  --pink:#ff3fa4;
  --cyan:#35e8ff;
  --panel:rgba(14,10,24,.74);
  --edge:rgba(255,255,255,.14);
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ui{position:fixed;inset:0;pointer-events:none;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--panel);
  border:1px solid var(--edge);color:var(--ink);font:600 12px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button.pill{cursor:pointer}
.tix b{color:#ffd23f;font-weight:700;font-variant-numeric:tabular-nums}
.right{display:flex;gap:8px}
#prompt{position:absolute;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 18px));transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);
  pointer-events:auto;white-space:nowrap;max-width:calc(100% - 32px)}
#prompt .nm{font:700 13px/1.1 var(--f);letter-spacing:.16em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
#prompt .nm small{display:block;font-weight:500;font-size:10px;letter-spacing:.12em;color:var(--ink-2);margin-top:3px}
.go{height:44px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;background:linear-gradient(180deg,#ff6cc0,var(--pink));color:#1a0010;
  font:700 14px/1 var(--f);letter-spacing:.2em;box-shadow:0 0 22px rgba(255,63,164,.55)}
.go:focus-visible,.pill:focus-visible,.pad:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#back{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px))}
#pads{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 14px));display:flex;gap:14px;align-items:flex-end}
.pad{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:1px solid var(--edge);background:var(--panel);color:var(--ink);
  font:700 12px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;touch-action:none;cursor:pointer}
.pad.a{width:88px;height:88px;background:radial-gradient(circle at 50% 35%,rgba(53,232,255,.5),rgba(14,10,24,.8) 70%);border-color:rgba(53,232,255,.6)}
.pad.on{transform:scale(.94);filter:brightness(1.4)}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid var(--edge);background:rgba(14,10,24,.35);display:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(244,236,255,.28);border:1px solid rgba(255,255,255,.4)}
#hint{position:absolute;left:50%;top:max(56px,calc(env(safe-area-inset-top,0px) + 52px));transform:translateX(-50%);font:500 11px/1.4 var(--f);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);text-align:center;white-space:nowrap;text-shadow:0 1px 6px #000}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:700 22px/1.2 var(--f);letter-spacing:.14em;color:#ffd23f;
  text-shadow:0 0 18px rgba(255,210,63,.7);opacity:0;transition:opacity .3s;text-align:center;white-space:nowrap}
#intro{position:fixed;inset:0;pointer-events:none}
#intro .pill{pointer-events:auto}
#intro.gone{display:none}
.lbx{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none}#barT{top:0}#barB{bottom:0}
#skip{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));opacity:.8}
#ihint{position:absolute;left:50%;bottom:max(26px,calc(env(safe-area-inset-bottom,0px) + 20px));transform:translateX(-50%);text-align:center;
  pointer-events:none;transition:opacity .45s;width:max-content;max-width:calc(100% - 32px);padding:14px 34px;
  background:radial-gradient(closest-side,rgba(7,6,11,.82),rgba(7,6,11,.5) 60%,rgba(7,6,11,0))}
#ihint b{display:block;font:700 15px/1.2 var(--f);letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 0 10px var(--pink),0 0 26px rgba(255,63,164,.6)}
#ihint span{display:block;font:500 12px/1.4 var(--f);letter-spacing:.12em;color:var(--ink-2);margin-top:6px;text-shadow:0 1px 6px #000}
.ui .top>*,#hint{transition:opacity .6s}
.ui.pin .tix,.ui.pin #hint{opacity:0}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Hyperdot Arcade 3D view. Power on the pinball machine to begin."></canvas>
<div class="lbx" id="barT"></div><div class="lbx" id="barB"></div>
<div class="ui pin" id="ui">
  <div class="top">
    <span class="pill tix" id="tix">Tickets <b id="tixN">0</b></span>
    <div class="right"><button class="pill" id="snd" type="button">Sound on</button></div>
  </div>
  <div id="hint">Walk up to a machine to play</div>
  <div id="toast"></div>
  <button class="pill" id="back" type="button" hidden>← Arcade</button>
  <div id="prompt" hidden><span class="nm" id="pName">Machine<small id="pSub">Video game</small></span><button class="go" id="play" type="button">PLAY</button></div>
  <div id="stick"><i></i></div>
  <div id="pads" hidden><button class="pad b" id="padB" type="button">B</button><button class="pad a" id="padA" type="button">A</button></div>
</div>
<div id="intro">
  <button class="pill" id="skip" type="button">Skip intro</button>
  <div id="ihint"><b>Press any key</b><span>to power on the machine</span></div>
</div>
<div id="err">This arcade needs WebGL2, which this browser or device has turned off.</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchy=matchMedia('(hover: none)').matches;
const lin=c=>Math.pow(c/255,2.2);
const hex=(h,k=1)=>{const n=parseInt(h.slice(1),16);return [lin(n>>16&255)*k,lin(n>>8&255)*k,lin(n&255)*k];};

/* ================= math ================= */
function m4(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;}
function mmul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}
function mT(x,y,z){const m=m4();m[12]=x;m[13]=y;m[14]=z;return m;}
function mS(x,y,z){const m=m4();m[0]=x;m[5]=y;m[10]=z;return m;}
function mRY(a){const m=m4(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;}
function mRX(a){const m=m4(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;}
function mRZ(a){const m=m4(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;}
function chain(...ms){let o=ms[0];for(let i=1;i<ms.length;i++)o=mmul(o,ms[i]);return o;}
function xf(m,x,y,z){return [m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14]];}
function persp(fy,as,n,f){const t=1/Math.tan(fy/2),m=new Float32Array(16);m[0]=t/as;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;}
function lookAt(e,t,u){
  let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2],l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx,m=new Float32Array(16);
  m[0]=xx;m[1]=yx;m[2]=zx;m[4]=xy;m[5]=yy;m[6]=zy;m[8]=xz;m[9]=yz;m[10]=zz;
  m[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);m[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);m[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);m[15]=1;return m;
}
function inv4(m){
  const a=m,o=new Float32Array(16);
  const b00=a[0]*a[5]-a[1]*a[4],b01=a[0]*a[6]-a[2]*a[4],b02=a[0]*a[7]-a[3]*a[4],b03=a[1]*a[6]-a[2]*a[5],b04=a[1]*a[7]-a[3]*a[5],b05=a[2]*a[7]-a[3]*a[6],
    b06=a[8]*a[13]-a[9]*a[12],b07=a[8]*a[14]-a[10]*a[12],b08=a[8]*a[15]-a[11]*a[12],b09=a[9]*a[14]-a[10]*a[13],b10=a[9]*a[15]-a[11]*a[13],b11=a[10]*a[15]-a[11]*a[14];
  let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return m4();d=1/d;
  o[0]=(a[5]*b11-a[6]*b10+a[7]*b09)*d;o[1]=(a[2]*b10-a[1]*b11-a[3]*b09)*d;o[2]=(a[13]*b05-a[14]*b04+a[15]*b03)*d;o[3]=(a[10]*b04-a[9]*b05-a[11]*b03)*d;
  o[4]=(a[6]*b08-a[4]*b11-a[7]*b07)*d;o[5]=(a[0]*b11-a[2]*b08+a[3]*b07)*d;o[6]=(a[14]*b02-a[12]*b05-a[15]*b01)*d;o[7]=(a[8]*b05-a[10]*b02+a[11]*b01)*d;
  o[8]=(a[4]*b10-a[5]*b08+a[7]*b06)*d;o[9]=(a[1]*b08-a[0]*b10-a[3]*b06)*d;o[10]=(a[12]*b04-a[13]*b02+a[15]*b00)*d;o[11]=(a[9]*b02-a[8]*b04-a[11]*b00)*d;
  o[12]=(a[5]*b07-a[4]*b09-a[6]*b06)*d;o[13]=(a[0]*b09-a[1]*b07+a[2]*b06)*d;o[14]=(a[13]*b01-a[12]*b03-a[14]*b00)*d;o[15]=(a[8]*b03-a[9]*b01+a[10]*b00)*d;
  return o;
}

/* ================= GL setup ================= */
const cv=$('gl');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,depth:true,powerPreference:'high-performance'});
if(!gl){$('err').style.display='grid';$('intro').hidden=true;return;}
const HDR=!!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
function prog(vs,fs){
  const p=gl.createProgram();
  for(const [t,src] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){
    const s=gl.createShader(t);gl.shaderSource(s,'#version 300 es\nprecision highp float;\nprecision highp int;\n'+src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)+'\n'+src.slice(0,200));
    gl.attachShader(p,s);
  }
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);u[inf.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,inf.name);}
  return {p,u};
}
const VS_MESH=`layout(location=0) in vec3 aP;layout(location=1) in vec3 aN;layout(location=2) in vec3 aC;layout(location=3) in float aE;layout(location=4) in vec2 aT;layout(location=5) in vec2 aM;
uniform mat4 uVP;uniform mat4 uM;out vec3 vW;out vec3 vN;out vec3 vC;out float vE;out vec2 vT;out vec2 vM;
void main(){vec4 w=uM*vec4(aP,1.0);vW=w.xyz;vN=mat3(uM)*aN;vC=aC;vE=aE;vT=aT;vM=aM;gl_Position=uVP*w;}`;
const FS_LIT=`in vec3 vW;in vec3 vN;in vec3 vC;in float vE;in vec2 vT;in vec2 vM;
uniform vec3 uCam;uniform vec4 uL[32];uniform int uNL;uniform vec3 uAmbT;uniform vec3 uAmbB;uniform vec3 uFog;uniform float uFogD;
uniform float uMode;uniform sampler2D uTex;uniform float uEmi;uniform vec3 uTint;uniform float uTime;uniform float uAlpha;
uniform vec4 uIgn;uniform vec2 uIgnP;uniform vec4 uCarve;uniform float uCarveY;uniform float uCarveK;uniform vec3 uCarveCol;uniform vec4 uRez;uniform vec2 uTear;
uniform sampler2D uAO;uniform vec4 uAOr;uniform float uPool;
uniform vec4 uZR[4];uniform vec4 uZT;uniform vec4 uZC;uniform sampler2D uRefl;uniform float uReflK;uniform vec2 uScr;
// which glossy floor a point is on: 0 carpet, 1 black epoxy, 2 chequer, 3 the landing pad
float zoneAt(vec2 p){
  if(uZC.w>0.0&&length(p-uZC.xy)<uZC.z)return uZC.w;
  for(int i=0;i<4;i++){vec4 r=uZR[i];if(uZT[i]>0.0&&p.x>r.x&&p.x<r.z&&p.y>r.y&&p.y<r.w)return uZT[i];}
  return 0.0;}
out vec4 o;
// what a glossy surface sees: a dark room, a band of neon round the walls at eye height, the ceiling's light panels
vec3 envR(vec3 r){
  float up=r.y,az=atan(r.z,r.x);
  vec3 c=mix(vec3(.016,.01,.03),vec3(.04,.025,.06),smoothstep(-.3,.5,up));
  float band=exp(-pow((up-.1)/.07,2.0)),tubes=smoothstep(.45,.95,sin(az*7.0)*.5+.5);
  c+=mix(vec3(1.,.12,.5),vec3(.12,.8,1.),.5+.5*sin(az*3.0+1.0))*band*(.18+tubes*.8);
  c+=vec3(1.,.9,.8)*step(.55,up)*smoothstep(.75,.97,sin(az*9.0)*sin(up*23.0))*1.4;
  c+=vec3(.9,.3,1.)*exp(-pow((up+.25)/.12,2.0))*.12;
  return c;
}
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h31(vec3 p){return h21(p.xy+p.z*vec2(17.13,31.71));}
// lattice coordinate on the plane the surface mostly lies in, so dots stay round on walls, floors and ceilings
vec2 cellUV(vec3 q,vec3 n){vec3 a=abs(n);return a.y>a.x&&a.y>a.z?fract(q.xz):a.x>a.z?fract(q.yz):fract(q.xy);}
vec3 carpet(vec2 p,out float g){
  vec3 base=vec3(.010,.008,.026);
  vec2 q=p*1.7;vec2 id=floor(q);vec2 f=fract(q)-.5;
  float h=h21(id),h2=h21(id+7.31),h3=h21(id+3.17);
  vec2 o2=f-vec2(h-.5,h2-.5)*.38;float a=h3*6.2832;o2=mat2(cos(a),-sin(a),sin(a),cos(a))*o2;
  float d;int t=int(h*5.0);
  if(t==0)d=abs(length(o2)-.17)-.03;
  else if(t==1)d=length(o2)-.075;
  else if(t==2){d=abs(o2.y-.06*sin(o2.x*20.0))-.026;d=max(d,abs(o2.x)-.27);}
  else if(t==3){vec2 k=abs(o2);d=abs(max(k.x*.866+o2.y*.5,-o2.y)-.11)-.025;}
  else{vec2 k=abs(o2);d=abs(k.x+k.y-.13)-.025;}
  vec3 c=h2<.25?vec3(1.,.08,.45):h2<.5?vec3(.05,.85,1.):h2<.75?vec3(1.,.8,.05):vec3(.55,.2,1.);
  float fq=fwidth(q.x);float m=(1.-smoothstep(-fq*.5,fq*1.2+.004,d))*(1.-smoothstep(.07,.22,fq));c*=.55;
  vec2 q2=p*7.0;vec2 id2=floor(q2);float s=h21(id2);vec2 f2=fract(q2)-.5-vec2(h21(id2+1.7)-.5,h21(id2+2.9)-.5)*.6;
  float sp=(s>.82)?1.-smoothstep(.04,.07,length(f2)):0.;
  vec3 c2=s>.94?vec3(1.,.1,.5):s>.88?vec3(.1,.9,1.):vec3(.8,.7,1.);
  sp*=1.-smoothstep(.02,.06,fwidth(q2.x));
  g=(m+sp*.4)*.55;
  return mix(mix(base,c2*.35,sp),c,m)+vec3(.012,.009,.022)*smoothstep(.07,.22,fq);
}
void main(){
  // CARVE: geometry inside a sphere dissolves; a fringe around the hole breaks into a lattice of hot dots
  float cg=0.0;
  if(uCarve.w>0.0&&vW.y>uCarveY){
    vec3 q=vW*uCarveK;float hh=h31(floor(q));
    float d=length(vW-uCarve.xyz)/uCarve.w,edge=.62+.38*hh;
    if(d<edge)discard;
    if(d<edge+.45){float k=(d-edge)/.45;if(length(cellUV(q,vN)-.5)>.16+.56*k)discard;cg=1.0-k;}
  }
  // REZ: the character assembles top-down out of dots
  float rg=0.0;
  if(uRez.x<1.0){
    vec3 q=vW/uRez.w;float hh=h31(floor(q)+17.0),hy=clamp((uRez.z-vW.y)/(uRez.z-uRez.y),0.,1.);
    float k=(uRez.x*1.3-(hy*.55+hh*.45))/.3;
    if(k<0.0)discard;
    if(k<1.0){if(length(cellUV(q,vN)-.5)>.2+.5*k)discard;rg=1.0-k;}
  }
  vec3 base=vC*uTint;float em=vE*uEmi;float g=0.0;
  // IGNITE (mode 1): emissive surfaces are dark until a ring spreading over the floor reaches them, then strike on
  // with a flicker; DRAIN (mode 2): a sphere that darkens a surface, with a hot rim, for the playfield's art lifting off
  float ig=1.0,fr=0.0,ignA=0.0;
  if(uIgnP.x>.5){
    bool dr=uIgnP.x>1.5;ignA=dr?0.0:1.0;
    float d=dr?length(vW-uIgn.xyz):length(vW.xz-uIgn.xz);
    ig=smoothstep(uIgn.w,uIgn.w-(dr?.035:1.0),d);
    fr=uIgn.w>0.0?exp(-pow((d-uIgn.w)/(dr?.012:.3),2.0)):0.0;
    if(!dr){float bh=uIgn.w-d;if(bh>0.0&&bh<1.4)ig*=mix(step(.4,h31(floor(vW*2.5)+floor(uTime*22.0))),1.0,smoothstep(.35,1.4,bh));}
  }
  float igE=ignA>.5?mix(uIgnP.y,1.0,ig):1.0;
  vec2 tuv=vT;
  if(uTear.x>0.0){float row=floor(vT.y*42.0);if(h21(vec2(row,uTear.y))<uTear.x)tuv.x+=(h21(vec2(row+3.0,uTear.y))-.5)*.3*uTear.x;}
  if(uMode>3.5){o=vec4(uTint,1.0);return;}
  if(uMode>2.5){vec4 t=texture(uTex,tuv);o=vec4(pow(t.rgb,vec3(2.2))*uEmi*uTint*(igE+fr*ignA*1.5)+uCarveCol*cg*3.0,1.0);return;}

    }

  }
  game.begin=()=>{reset(false);G.mode='play';};

    if(G.mode==='over'){G.mt2+=dt;update(dt,null);if(G.mt2>3.5){G.mode='ready';reset(true);G.mode='ready';}return;}
    if(G.mode==='ready'){update(dt,null);if(inp&&inp.aP){reset(false);G.mode='play';S.coin();}return;}

  };
  game.draw=draw;
  reset(true);

}

    if(H_.state==='over'){H_.pause-=dt;if(H_.pause<=0&&inp&&(inp.aP||inp.ptrDown))a.start();return;}

    if(inp){
      if(inp.ptr){const hit=rayPlaneY(inp.ptr[0],inp.ptr[1],SY+.02);if(hit){H_.me.tx=hit[0]-o.x;H_.me.tz=hit[2]-o.z;}}
      if(inp.mx||inp.my){H_.me.tx+=inp.mx*1.6*dt;H_.me.tz+=inp.my*1.6*dt;}
    }
    H_.me.tx=clamp(H_.me.tx,-HW+RM,HW-RM);H_.me.tz=clamp(H_.me.tz,RM+.02,HL-RM);

      const p=H_.p;
      if(H_.state==='live'){
        p.x+=p.vx*h;p.z+=p.vz*h;const fr=Math.pow(.86,h);p.vx*=fr;p.vz*=fr;
        if(p.x<-HW+RP){p.x=-HW+RP;p.vx=Math.abs(p.vx)*.9;wallHit(p.vx);}
        if(p.x>HW-RP){p.x=HW-RP;p.vx=-Math.abs(p.vx)*.9;wallHit(p.vx);}
        for(const sz of [-1,1]){
          if(sz*p.z>HL-RP){
            if(Math.abs(p.x)<GOAL-RP*.3){if(sz*p.z>HL+.05){goal(sz>0?'ai':'me');break;}}
            else{p.z=sz*(HL-RP);p.vz=-sz*Math.abs(p.vz)*.9;wallHit(p.vz);}
          }
        }
        collide(H_.me);collide(H_.ai);
        const sp=Math.hypot(p.vx,p.vz);if(sp>6.5){p.vx*=6.5/sp;p.vz*=6.5/sp;}
      }
    }
  }
  function wallHit(v){if(Math.abs(v)>.3)S.click(Math.min(.12,Math.abs(v)*.03));}
  function moveMallet(m,tx,tz,max,h){
    let dx=tx-m.x,dz=tz-m.z;const d=Math.hypot(dx,dz),stepMax=max*h;
    if(d>stepMax){dx*=stepMax/d;dz*=stepMax/d;}
    m.vx=dx/h;m.vz=dz/h;m.x+=dx;m.z+=dz;
  }
  function collide(m){
    const p=H_.p,dx=p.x-m.x,dz=p.z-m.z,d=Math.hypot(dx,dz),R=RP+RM;
    if(d<R&&d>1e-6){

      const rvx=p.vx-m.vx,rvz=p.vz-m.vz,vn=rvx*nx+rvz*nz;
      if(vn<0){p.vx-=1.9*vn*nx;p.vz-=1.9*vn*nz;const imp=Math.abs(vn);if(H_.t-H_.lastHit>.05){S.click(Math.min(.16,.03+imp*.03));H_.lastHit=H_.t;}H_.flash=Math.min(1,imp*.2);}
    }
  }
  function aiStep(h){

      const ax=p.x-(0-p.x)*.12,az=p.z-.09;
      tx=ax;tz=az;if(Math.hypot(ai.x-ax,ai.z-az)<.07){tx=p.x;tz=p.z+.08;}
    }else{tx=clamp(p.x*.55,-.25,.25);tz=-.82;}

  }
  function goal(who){
    H_.state='serve';H_.pause=1.1;

      finishGame(a,won?20:Math.max(1,H_.sMe*2),'AIR HOCKEY · '+H_.sMe+' - '+H_.sAi);
    }
  }
  ATTR.push(a);return a;
}

/* ================= INTRO PINBALL: table layout + 2D physics (u across, v up the slope, metres) ================= */
// A rolling steel ball on a 6.5-degree playfield. Gravity along the slope is 5/7 g sin(theta) because a rolling
// solid sphere stores 2/7 of its kinetic energy as spin. Everything is a capsule (segment + radius) or a circle;
// flippers are tapered capsules that move, so contacts use the flipper's surface velocity (omega x r).
function PinPhys(cfg){cfg=cfg||{};
  const R=.0135,G=9.81*Math.sin(6.5*Math.PI/180)*5/7,HW=.26,L=1.06,AC=.80,AR=.26;
  const CCV=.745,LANE_X=.2225,LANE_U=.2425,PLUNGE_V=.07;
  const UC=(-HW+LANE_X-.0035)/2;                       // centre of the play area (left of the shooter lane)
  const T={R,G,HW,L,AC,AR,LANE_X,LANE_U,UC,seg:[],cir:[],sw:[],flip:[],poly:[]};
  const seg=(ax,ay,bx,by,r,e,kind,o)=>{const s=Object.assign({ax,ay,bx,by,r,e,kind:kind||'wall',on:true},o);T.seg.push(s);return s;};
  const cir=(x,y,r,e,kind,o)=>{const c=Object.assign({x,y,r,e,kind:kind||'post',flash:0},o);T.cir.push(c);return c;};
  const poly=(pts,e,kind,face)=>{for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];seg(a[0],a[1],b[0],b[1],.003,e,(face!=null&&i===face)?kind:'rubber');}T.poly.push({pts,kind});};

  // ---- outer walls and the top arc ----
  seg(-HW,.30,-HW,.60,.004,.45);seg(-HW,CCV,-HW,AC,.004,.45);
  seg(HW,0,HW,AC,.004,.45);
  const ARC=[];for(let i=0;i<=28;i++){const a=i/28*Math.PI;ARC.push([Math.cos(a)*AR,AC+Math.sin(a)*AR]);}
  for(let i=0;i<28;i++)seg(ARC[i][0],ARC[i][1],ARC[i+1][0],ARC[i+1][1],.004,.4);
  T.arc=ARC;
  // ---- shooter lane ----
  T.laneWall=seg(LANE_X,0,LANE_X,.74,.0035,.4);
  seg(LANE_X,0,HW,0,.003,.2);
  T.gate=seg(LANE_X+.002,.745,HW-.004,.80,.0025,.35,'gate',{on:false});   // one-way: closes once the ball is out
  // ---- left orbit curl: a full orbit comes down the left wall, U-turns in this cup and is thrown right into the bumpers ----
  const CC=[-.205,.745],CR=.055,CURL=[];
  const CEND=cfg.curlEnd||265;for(let i=0;i<=10;i++){const a=(180+i*(CEND-180)/10)*Math.PI/180;CURL.push([CC[0]+Math.cos(a)*CR,CC[1]+Math.sin(a)*CR]);}
  T.curl=CURL;
  for(let i=0;i<CURL.length-1;i++)seg(CURL[i][0],CURL[i][1],CURL[i+1][0],CURL[i+1][1],.004,.45);
  const ce=CURL[CURL.length-1];seg(ce[0],ce[1],-HW,.60,.004,.45);           // underside of the curl block
  T.curlPoly=[...CURL,[-HW,.60]];
  // ---- lower playfield: flipper funnels, slingshots ----
  const fx=.09,FPV=.14;
  const LP=[UC-fx,FPV],RP=[UC+fx,FPV];
  seg(-HW,.30,LP[0]-.004,LP[1]+.018,.004,.35);
  seg(LANE_X-.0035,.30,RP[0]+.004,RP[1]+.018,.004,.35);
  seg(-HW,.30,-HW,.0,.004,.3);
  const mir=p=>[2*UC-p[0],p[1]];
  const SL=[[-.205,.39],[-.205,.317],[-.152,.281]];
  T.slingL=SL;T.slingR=SL.map(mir).reverse();
  for(const S of [T.slingL,T.slingR]){
    // kick face: the long edge facing the middle
    const left=S===T.slingL,A=left?S[0]:S[2],C=left?S[2]:S[0];
    seg(A[0],A[1],C[0],C[1],.006,.72,'sling',{side:left?-1:1,flash:0});
    const B=S[1];seg(A[0],A[1],B[0],B[1],.005,.5,'rubber');seg(B[0],B[1],C[0],C[1],.005,.5,'rubber');
    for(const p of S)cir(p[0],p[1],.007,.55,'post');
  }
  // ---- top rollover lanes ----
  T.laneGuides=[];for(const u of (cfg.guides||[-.10,-.05,0,.05])){T.laneGuides.push(u);seg(u,.84,u,.905,.005,.55,'rubber');}
  T.rollovers=(cfg.lanes||[-.075,-.025,.025]).map((u,i)=>({u,v:.875,lit:false,flash:0,i,inside:false}));
  // ---- pop bumpers ----
  T.bumpers=(cfg.bumpers||[[-.075,.735],[.025,.745],[-.03,.655]]).map((p,i)=>cir(p[0],p[1],.0255,.5,'bumper',{i,flash:0,ring:0}));
  // ---- posts above the slings (classic "inlane" rubber posts) ----
  // ---- flippers ----
  const mkF=(p,side)=>({x:p[0],y:p[1],side,len:.072,r0:.0118,r1:.0062,rest:side<0?-28*Math.PI/180:Math.PI+28*Math.PI/180,
    up:side<0?30*Math.PI/180:Math.PI-30*Math.PI/180,a:0,w:0,held:false});
  T.flip=[mkF(LP,-1),mkF(RP,1)];for(const f of T.flip)f.a=f.rest;

  // ---- state ----
  const B={u:LANE_U,v:PLUNGE_V+R,vu:0,vv:0,h:R,live:true,spin:0,roll:0};
  T.ball=B;T.plunger={pull:0,pos:0,fire:0,v:PLUNGE_V};T.events=[];T.inPlay=false;T.drained=false;T.t=0;
  const ev=(type,o)=>T.events.push(Object.assign({type,t:T.t},o||{}));

  function contact(nx,ny,d,rad,e,surfU,surfV,s){
    // push out, reflect relative normal velocity
    const pen=rad-d;B.u+=nx*pen;B.v+=ny*pen;
    const rvu=B.vu-(surfU||0),rvv=B.vv-(surfV||0),vn=rvu*nx+rvv*ny;
    if(vn<0){B.vu-=(1+e)*vn*nx;B.vv-=(1+e)*vn*ny;

      if(vn<-.15){const tu=-ny,tv=nx,vt=rvu*tu+rvv*tv;B.vu-=vt*tu*.04;B.vv-=vt*tv*.04;}}

    windSet(api.vel);
    if(rig.eye[1]<TBY-3)api.tableOn=false;
    if(u>.66)api.arcadeOn=true;                    // only once the ceiling fills the view below you
    // the ceiling opens under you, its rim a ring of hot dots
    api.carve={c:[rig.eye[0],ROOM.h,rig.eye[2]],r:1.7*sstep(ROOM.h+5.5,ROOM.h+.5,y),y0:ROOM.h-.32,k:1/.075,col:[.7,.3,.62]};
    for(const L of LAY)if(!L.passed&&rig.eye[1]<L.y+.25){L.passed=true;SX.chime(L.note);for(let i=0;i<8;i++)spawnDeb([L.cx+rnd(-.6,.6),L.y,L.cz+rnd(-.6,.6)],[rnd(-1,1),rnd(.5,2),rnd(-1,1)],L.col,rnd(.4,.9),.02,0);}
    if(u>=.5&&!api.chordC){api.chordC=1;SX.pad([48,55,60,64,67],2.6,.022);}
    if(u>=.62&&!api.rise){api.rise=1;SX.riser(F.T*(1-.62),.1);}
    // the ball leads the way, then drops away into the arcade ahead of you
    const fb=api.fb;
    if(!fb.free){const yb=y-(1.0+2.8*u*u),c=pathXZ(yb);fb.p=[c[0],yb,c[1]];if(yb<ROOM.h+.05){fb.free=true;fb.v=[.15,-(api.vel+2.5),-.9];}}
    else ballStep(dt,.45);
    BALL_L.p=fb.p;BALL_L.k=fb.p[1]<ROOM.h+1.5?1.5:.8;
    tunA=1-.6*sstep(.78,1,u);
    if(u>=1)startDescend();
  }
  function ballStep(dt,ws){
    const b=api.fb;if(!b||!b.free)return;const h=dt*ws,r=R*3;
    b.v[1]-=9.81*h;b.p[0]+=b.v[0]*h;b.p[1]+=b.v[1]*h;b.p[2]+=b.v[2]*h;
    if(b.p[1]<r){b.p[1]=r;if(b.v[1]<-.4){const v=Math.min(1,-b.v[1]/4);SX.ballBounce(v);for(let i=0;i<10;i++)spawnDeb([b.p[0],.03,b.p[2]],[rnd(-.8,.8),rnd(.3,1.2)*v,rnd(-.8,.8)],PAL[(Math.random()*2)|0],rnd(.3,.7),.012,3);}
      b.v[1]=-b.v[1]*.45;if(Math.abs(b.v[1])<.35)b.v[1]=0;const fr=Math.exp(-.35*h);b.v[0]*=fr;b.v[2]*=fr;}
    if(b.p[1]<.9)for(const o of OBST){if(b.p[0]>o.x0-r&&b.p[0]<o.x1+r&&b.p[2]>o.z0-r&&b.p[2]<o.z1+r){
      const pen=[b.p[0]-(o.x0-r),(o.x1+r)-b.p[0],b.p[2]-(o.z0-r),(o.z1+r)-b.p[2]],i=pen.indexOf(Math.min(...pen));
      if(i===0){b.p[0]=o.x0-r;b.v[0]=-Math.abs(b.v[0])*.6;}else if(i===1){b.p[0]=o.x1+r;b.v[0]=Math.abs(b.v[0])*.6;}
      else if(i===2){b.p[2]=o.z0-r;b.v[2]=-Math.abs(b.v[2])*.6;}else{b.p[2]=o.z1+r;b.v[2]=Math.abs(b.v[2])*.6;}}}
    b.p[0]=clamp(b.p[0],ROOM.x0+r,ROOM.x1-r);b.p[2]=clamp(b.p[2],ROOM.z0+r,ROOM.z1-r);
  }
  const DK=1.1,DTA=2.15;                             // the slow-motion descent: deceleration rate, and when time snaps back
  function startDescend(){
    setStage('descend');SX.muffle(450,.25);SX.crackle(14);SX.heart(.35);SX.heart(1.25);SX.riser(TL.descend-.5,.14);SX.pad([43,55,59,62],2.8,.02);
    for(let i=0;i<70;i++){const a=Math.random()*TAU,r=rnd(1.2,1.7);spawnDeb([CH_.x+Math.cos(a)*r,ROOM.h-.02,CH_.z+Math.sin(a)*r],[rnd(-.2,.2),rnd(-.6,0),rnd(-.2,.2)],PAL[(Math.random()*5)|0],rnd(.8,1.8),rnd(.012,.025),1.2);}
    windSet(0);
  }
  function updateDescend(dt){
    const t=api.st;let y,ws;
    if(t<DTA){y=ROOM.h-(F.v1/DK)*(1-Math.exp(-DK*t));ws=.3;}
    else{const q=clamp((t-DTA)/(TL.descend-DTA),0,1),yA=ROOM.h-(F.v1/DK)*(1-Math.exp(-DK*DTA));y=lerp(yA,1.62,q*q);ws=lerp(.3,1,q);}
    rig.eye=[CH_.x,y,CH_.z];
    const e=sstep(.45,2.25,t);rig.fwd=nl(DOWN,LOOK0,e);rig.up=nl(NZ,[0,1,0],e);rig.fov=lerp(74,62,e);
    api.carve={c:[CH_.x,ROOM.h,CH_.z],r:1.7*(1-sstep(.6,2.0,t)),y0:ROOM.h-.32,k:1/.075,col:[.7,.3,.62]};
    api.post.rad=(reduce?.1:.5)*(1-sstep(0,.8,t));tunA=.4*(1-sstep(0,.6,t));
    ballStep(dt,ws);BALL_L.p=api.fb.p;BALL_L.k=1.5;
    if(t>=TL.descend)startLand();
  }
  function startLand(){
    setStage('land');SX.slam();SX.muffle(20000,.05);api.exp=1.1;api.ringT=api.t;W_.camYaw=0;
    for(let i=0;i<46;i++){const a=Math.random()*TAU;spawnDeb([CH_.x+Math.cos(a)*.3,.05,CH_.z+Math.sin(a)*.3],[Math.cos(a)*rnd(.6,1.8),rnd(.6,1.9),Math.sin(a)*rnd(.6,1.8)],PAL[(Math.random()*2)|0],rnd(.5,1.1),.018,6);}
    IGN.mode=1;IGN.r=0;IGN.c=[CH_.x,0,CH_.z];
    api.strike=LIGHTS.concat(BEAMS).map(L=>({L,t:Math.hypot(L.p[0]-CH_.x,L.p[2]-CH_.z)/WAVE_V,done:false})).sort((a,b)=>a.t-b.t);
    api.signT=Math.hypot(SIGN[0]-CH_.x,SIGN[2]-CH_.z)/WAVE_V;api.lastClunk=-9;
    SX.powerSweep(api.signT);
  }
  function updateLand(dt){
    const t=api.st;
    const dip=-.17*(t<.1?t/.1:Math.exp(-(t-.1)*5));
    rig.eye=[CH_.x,1.62+dip,CH_.z];
    const e1=sstep(.55,2.3,t);rig.fwd=nl(LOOK0,norm(sub(SIGN,rig.eye)),e1);rig.up=[0,1,0];rig.fov=lerp(62,50,sstep(1.5,TL.land,t));
    shake(.03*Math.exp(-t*9));
    // the wave: everything it reaches switches on
    IGN.r=WAVE_V*t;
    for(const s of api.strike){s.L.pw=flickOn(s.t,t);if(!s.done&&t>=s.t){s.done=true;if(api.t-api.lastClunk>.07){api.lastClunk=api.t;SX.clunk(1/(1+s.t*.6));}}}
    AP.amb=lerp(.13,1,sstep(0,2.7,t));
    if(t>=api.signT*.55&&!api.buzzed){api.buzzed=1;SX.buzz(.45,.022);}
    if(t>=api.signT&&!api.signed){api.signed=1;SX.stinger();api.music=true;api.exp=Math.max(api.exp,.5);}
    ballStep(dt,1);BALL_L.p=api.fb.p;BALL_L.k=1.5*(1-sstep(.5,2.5,t))+.5;
    if(t>=TL.land)startPull();
  }
  let PU={};
  function startPull(){
    setStage('pull');api.rezT=api.t+.55;CH_.hidden=false;CH_.rez=0;SX.rezz();IGN.mode=0;
    $('intro').classList.add('gone');
    PU={eye:rig.eye.slice(),tgt:add(rig.eye,rig.fwd),fov:rig.fov};
    for(const L of LIGHTS.concat(BEAMS))L.pw=1;Object.assign(AP,{light:1,neon:1,amb:1,scr:1});
  }
  function updatePull(dt){
    const t=api.st,e=easeIO(clamp(t/TL.pull,0,1)),w=walkCam();
    rig.eye=mix3(PU.eye,w.eye,e);const tg=mix3(PU.tgt,w.tgt,e);rig.fwd=norm(sub(tg,rig.eye));rig.up=[0,1,0];rig.fov=lerp(PU.fov,w.fov,e);
    CH_.rez=clamp((t-.3)/1.3,0,1);
    if(t>.9&&!api.hud){api.hud=1;$('ui').classList.remove('pin');W_.hintT=7;$('hint').textContent=touchy?'Drag on the left to walk · drag on the right to look':'WASD / arrows walk · drag to look · E to play';}
    // the ball's last moment: it breaks into dots
    const fb=api.fb;if(fb&&fb.vis>0&&t>.6){fb.vis=0;for(let i=0;i<24;i++)spawnDeb(fb.p,[rnd(-1,1),rnd(.5,2),rnd(-1,1)],PAL[(Math.random()*3)|0],rnd(.4,.9),.015,2);SX.chime(93);}
    ballStep(dt,1);BALL_L.k=fb&&fb.vis>0?.6:0;
    api.carve=null;
    if(t>=TL.pull)finish();
  }
  function finish(){
    api.active=false;api.stage='done';W_.mode='walk';CH_.hidden=false;CH_.rez=1;IGN.mode=0;
    for(const L of LIGHTS.concat(BEAMS))L.pw=1;Object.assign(AP,{light:1,neon:1,amb:1,scr:1});
    api.carve=null;api.tear.a=0;Object.assign(api.post,{gl:0,dot:0,rad:0});api.music=true;api.dyn=[];api.exp=0;
    CAM.up=[0,1,0];CAM.minH=null;imStop(false);windSet(0);stopNodes();SX.muffle(20000,.05);if(AU.ctx)SX.unsilence();DEB.length=0;NP=0;setBars(0);
    $('ui').classList.remove('pin');$('intro').classList.add('gone');
    if(!(W_.hintT>0)){W_.hintT=6;$('hint').textContent=touchy?'Drag on the left to walk · drag on the right to look':'WASD / arrows walk · drag to look · E to play';}
    cv.focus();
  }
  function skip(){
    if(!api.active||api.fadeHold||api.stage==='pull')return;
    api.fadeHold=true;hideHint();
  }
  const BAR_ON={glitch:1,dive:1,fall:1,descend:1,land:1};
  function update(dt){
    api.t+=dt;
    if(api.fadeHold){if(FADE<=.001){api.fadeHold=false;api.fastFade=true;W_.camYaw=0;finish();const w=walkCam();CAM.eye=w.eye;CAM.tgt=w.tgt;CAM.fov=w.fov;}return;}
    pollPad();audioNodes();imTick();
    const st=api.stage;
    api.st+=st==='boot'?dt*api.bootSpeed:dt;
    if(st==='off')updateOff(dt);
    else if(st==='boot')updateBoot(dt);
    else if(st==='ready'||st==='play')updateGame(dt);
    else if(st==='glitch')updateGlitch(dt);
    else if(st==='dive')updateDive(dt);
    else if(st==='fall')updateFall(dt);
    else if(st==='descend')updateDescend(dt);
    else if(st==='land')updateLand(dt);
    else if(st==='pull')updatePull(dt);
    if(!api.active)return;
    if(api.hintT>0){api.hintT-=dt;if(api.hintT<=0)hideHint();}
    const bt=BAR_ON[api.stage]?1:0;setBars(api.bars+(bt-api.bars)*Math.min(1,dt*(bt?1.6:2.4)));
    if(api.dotT>0){api.dotT-=dt;if(api.dotT<=0)api.post.dot=0;}
    api.exp*=Math.exp(-dt*3.5);
    updateLamps(dt);updateDeb(dt);buildPoints();
    if(api.tableOn)drawDMD(dt);
    rollSound();applyRig();
    api.ballVis=api.tableOn&&B.h>-.05&&['off','boot','ready','play','glitch','dive'].includes(api.stage);
  }
  build();
  B.h=R;
  Object.assign(api,{update,draw,drawScreens,drawPts,setCarve,key,ptr,clearInput,skip,P,HOLE,
    test:{power(){audioInit();power();},launch(p){P.release(p);SX.launch(p);if(!IM.on)imStart();},state:()=>({stage:api.stage,st:+api.st.toFixed(2),dings:api.dings})}});
  updateOff(0);applyRig();
  return api;
})();

/* ================= boot ================= */
buildRoom();buildCharacter();
for(const a of ATTR)if(a.build){WORLD.fin(.4,0);a.build(WORLD);}WORLD.fin(0,0);
worldMesh=mesh(WORLD);floorMesh=mesh(FLOOR);
resize();buildFloorAO();
window.__arcade={W_,CH_,CAM,ATTR,IN,KEY,PIN,AP,LIGHTS,BEAMS,HZ,LOOK,get Q(){return Q.n},startAttr,leaveAttr,enterArcade,ff:(sec)=>{for(let i=0;i<sec*60;i++)step(1/60);},tris:()=>(worldMesh.n+floorMesh.n)/3,fps:()=>fps};
requestAnimationFrame(frame);
})();
</script>
