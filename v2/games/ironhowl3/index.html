<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>IRONHOWL 3</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font:700 13px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.08em;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{position:fixed;left:0;top:0;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#load{display:flex;background:#000}
#load .bar{width:min(260px,60vw);height:4px;background:#ffffff1f;border-radius:2px;overflow:hidden}#ldbar{height:100%;width:0;background:#ffb347;transition:width .2s}
.logo{font-size:clamp(34px,9vw,64px);letter-spacing:.14em;color:#ffb347;text-shadow:0 0 24px #ff8a1a88}
.sub{color:#ffffffaa;font-size:12px;letter-spacing:.22em}
#title{background:linear-gradient(#0008,#0003 40%,#0008);cursor:pointer}
#title .go{margin-top:18px;color:#fff;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.35}}
#title .keys{color:#ffffff88;font-size:11px;max-width:86vw;line-height:1.7}
.touch #title .keys.desk,#title .keys.tch{display:none}.touch #title .keys.tch{display:block}
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
#fuel{display:flex;gap:5px;align-items:center}
#fuel i{display:block;width:30px;height:9px;border-radius:3px;background:#ffffff26;overflow:hidden}#fuel b{display:block;height:100%;width:0;background:#9cd2ff}
#fuel i.full b{background:#d9efff;box-shadow:0 0 8px #9cd2ff}
#fuel.no i{animation:no .5s}@keyframes no{30%{background:#ff3b30aa}}
.btns{display:flex;gap:8px;pointer-events:auto}
button{font:inherit;color:#ffb347;background:#0009;border:1px solid #ffb34755;border-radius:9px;padding:8px 11px;cursor:pointer}
button:active{background:#ffb34733}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #ffffffb0;border-radius:50%;pointer-events:none;box-shadow:0 0 4px #000a}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:#ffb347;border-radius:50%}
#bjet{color:#d9efff;border:2px solid #9cd2ff88;background:#0a1a2a99}#bjet.on{background:#9cd2ff55}
#stick{display:none;position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid #ffffff33;background:#ffffff0d;pointer-events:none}
#knob{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:#ffffff40}
#hint{position:fixed;left:0;right:0;top:calc(max(10px,env(safe-area-inset-top)) + 46px);text-align:center;color:#ffffffcc;font-size:11px;opacity:0;transition:opacity .8s;pointer-events:none;padding:0 16px;text-shadow:0 1px 3px #000}
#menu{background:#000b;z-index:5}#menu button{width:min(280px,76vw);padding:13px;font-size:14px}
#stat{display:flex;flex-direction:column;gap:5px}
.bar{width:132px;height:7px;border-radius:3px;background:#ffffff22;overflow:hidden}.bar b{display:block;height:100%;width:100%;transition:width .15s}
#bshield{background:#7cc4ff;box-shadow:0 0 6px #7cc4ff}#bhull{background:#ffb347}#bhull.low{background:#ff4a3a;animation:bl .6s infinite}
#gline{display:flex;gap:10px;font-size:11px;color:#ffffffc0}#gtier{color:#ffd76a}
#mid{position:absolute;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));text-align:center;pointer-events:none}
#score{font-size:18px;color:#fff;text-shadow:0 1px 3px #000}#combo{font-size:12px;color:#ffd76a;min-height:14px}
#cross.on{border-color:#ffb347}#cross.hit{border-color:#ff5a3a;transform:scale(1.25)}
#heat{position:fixed;left:50%;top:50%;width:54px;height:4px;margin:18px 0 0 -27px;border-radius:2px;background:#ffffff1f;overflow:hidden;pointer-events:none}
#heatb{height:100%;width:0;background:#ffcf7a}#heat.warm #heatb{background:#ff8a3a}#heat.over #heatb{background:#ff3b30}#heat.over{animation:bl .4s infinite}
#msg{position:fixed;left:0;right:0;top:calc(50% + 34px);text-align:center;color:#ffd76a;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 3px #000}
#banner{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:clamp(22px,5vw,34px);color:#ffb347;letter-spacing:.2em;opacity:0;pointer-events:none;text-shadow:0 0 18px #ff7a1a88}
#banner.go{animation:ban 2.2s}@keyframes ban{0%{opacity:0;transform:scale(1.3)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.dmg{position:fixed;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .3s;pointer-events:none}
.dmg:before{content:"";position:absolute;left:-60px;top:calc(-1 * min(38vh,38vw));width:120px;height:14px;border-radius:50%;background:radial-gradient(#ff3b30,transparent 70%)}
.dmg.s:before{background:radial-gradient(#7cc4ff,transparent 70%)}
.ea{display:none;position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none}
.ea:before{content:"";position:absolute;left:-9px;top:calc(-1 * min(42vh,44vw));border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:13px solid #ff3b30cc}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(transparent 55%,#ff1a0080)}
.tb{display:none;position:fixed;border-radius:50%;font-size:13px}.touch .tb{display:block}
#bfire{right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:96px;height:96px;color:#ffd0a0;border:2px solid #ff9a4088;background:#2a140899;font-size:15px}
#bfire.on{background:#ff9a4055}
#bjet{right:calc(max(18px,env(safe-area-inset-right)) + 108px);bottom:max(16px,env(safe-area-inset-bottom));width:74px;height:74px}
#bmsl{right:calc(max(18px,env(safe-area-inset-right)) + 12px);bottom:calc(max(20px,env(safe-area-inset-bottom)) + 108px);width:68px;height:68px;color:#ffc080;font-size:11px}
#bvent{right:calc(max(18px,env(safe-area-inset-right)) + 92px);bottom:calc(max(20px,env(safe-area-inset-bottom)) + 92px);width:56px;height:56px;font-size:10px;color:#e0e8f0}
#bvent.cool{opacity:.35}#bvent.hot{border-color:#ff3b30;animation:bl .5s infinite}
.touch #mslc{display:none}
#maps{display:flex;gap:8px;margin-top:6px}#maps button{padding:9px 14px;color:#ffffffaa;border-color:#ffffff33}#maps button.sel{color:#ffb347;border-color:#ffb347;background:#ffb34722}
#down{background:#000a;z-index:4;cursor:pointer}#down .logo{color:#ff6a4a}
#dev{position:fixed;left:12px;top:40px;font:11px monospace;color:#7f7;pointer-events:none;text-shadow:0 0 3px #000}
</style></head><body>
<canvas id="gl"></canvas>
<div id="top"><div id="stat"><div class="bar"><b id="bshield"></b></div><div class="bar"><b id="bhull"></b></div><div id="fuel"></div><div id="gline"><span id="gtier">GUN I</span><span id="mslc">MSL 12</span></div></div><div class="btns"><button id="bview">CLOSE</button><button id="bpause">II</button></div></div>
<div id="mid"><div id="score">0</div><div id="combo"></div></div>
<div id="vig"></div><div id="cross"></div><div id="heat"><div id="heatb"></div></div><div id="msg"></div><div id="banner"></div>
<div class="dmg" id="dmg0"></div><div class="dmg" id="dmg1"></div><div class="dmg" id="dmg2"></div><div class="dmg" id="dmg3"></div><div class="ea" id="ea0"></div><div class="ea" id="ea1"></div><div class="ea" id="ea2"></div><div class="ea" id="ea3"></div><div class="ea" id="ea4"></div><div class="ea" id="ea5"></div>
<button id="bfire" class="tb">FIRE</button><button id="bjet" class="tb">JET</button><button id="bmsl" class="tb">MSL</button><button id="bvent" class="tb">VENT</button>
<div id="stick"><div id="knob"></div></div>
<div id="hint"></div>
<div id="dev"></div>
<div id="menu" class="ov"><div class="sub">PAUSED</div><button id="mresume">RESUME</button><button id="mview"></button><button id="mqual"></button><button id="msound"></button><button id="msens"></button><button id="mexit">EXIT</button></div>
<div id="down" class="ov"><div class="logo">HOWLER DOWN</div><div class="sub" id="dscore"></div><div class="go" id="dgo">TAP TO GO AGAIN</div></div>
<div id="title" class="ov"><div class="logo">IRONHOWL 3</div><div class="sub">SANDBOX · PICK A PLACE</div>
  <div id="maps"><button data-map="woods">WOODS</button><button data-map="field">FIELD</button><button data-map="docks">DOCKS</button></div>
  <div class="go"><span class="desk-go">CLICK OR TAP TO START</span></div>
  <div class="keys desk">WASD MOVE · MOUSE AIM · CLICK FIRE · RIGHT CLICK MISSILES · R VENT · SPACE JET HOP · V CAMERA</div>
  <div class="keys tch">LEFT THUMB MOVES · RIGHT THUMB AIMS · HOLD FIRE AND DRAG IT TO AIM · PLAY SIDEWAYS</div></div>
<div id="load" class="ov"><div class="logo">IRONHOWL 3</div><div class="bar"><div id="ldbar"></div></div></div>
<script src="js/three-ih3.min.js"></script>
<script src="js/ironhowl3.js"></script>
</body></html>
