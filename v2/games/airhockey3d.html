<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Air Hockey 3D</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&display=swap">
<style>
/* AIR HOCKEY 3D — Hyperdot Arcade. Full-resolution 3D in three.js; the HUD and the scoreboard are
   LED dots. Dark-only by design (it is a blacklit arcade). */
:root{--bg:#07060b;--ink:#efeaf6;--ink-2:#a39cb4;--p1:#2fd8ff;--p2:#ff2f8a;--gold:#ffd23f;
  --panel:rgba(18,15,24,.8);--edge:rgba(255,255,255,.14);--f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--f)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;z-index:3;
  padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.brand{font:700 13px/1 var(--f);letter-spacing:.3em;color:var(--p1);text-shadow:0 0 12px rgba(47,216,255,.55);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(6px)}
.chip.on{border-color:rgba(47,216,255,.7);color:#bff6ff}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.inmenu #pauseBtn{display:none}
body.touch .bar{display:none}
#pz{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;padding:0;display:none;z-index:3;
  border:1px solid var(--edge);background:var(--panel);color:var(--ink);font:700 12px/1 var(--f);letter-spacing:.05em;cursor:pointer;opacity:.7}
body.touch #pz,body.embed #pz{display:grid;place-items:center}
body.embed .bar{display:none!important}
body.embed:not(.touch) #pz{opacity:.35}
body.inmenu #pz{display:none!important}

/* ---------- menus over the live table ---------- */
.scr{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;pointer-events:none;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scr>*{pointer-events:auto}
.mb{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:14px;border:1px solid var(--edge);background:rgba(16,12,26,.86);color:var(--ink);
  font:700 13px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:border-color .15s,transform .1s}
.mb:hover{border-color:rgba(255,255,255,.4)}.mb:active{transform:scale(.97)}
.mb.big{min-height:56px;font-size:16px;background:linear-gradient(100deg,rgba(47,216,255,.32),rgba(255,47,138,.32));border-color:rgba(255,255,255,.32);box-shadow:0 0 24px rgba(255,47,138,.18)}
/* the title */
#sTitle{justify-content:space-between;background:linear-gradient(to top,rgba(6,4,12,.92) 0,rgba(6,4,12,.55) 34%,rgba(6,4,12,0) 58%),linear-gradient(to bottom,rgba(6,4,12,.6),rgba(6,4,12,0) 26%)}
.logo{margin-top:clamp(10px,4vh,48px);text-align:center;line-height:.86;pointer-events:none}
.logo b{display:inline-block;margin:0 .14em;font:italic 700 clamp(46px,9vw,84px)/.95 var(--f);letter-spacing:.04em;color:#fff;
  text-shadow:0 0 6px #fff,0 0 18px var(--p2),0 0 44px var(--p2),0 0 80px rgba(255,47,138,.5)}
.logo b+b{color:#eafcff;text-shadow:0 0 6px #fff,0 0 18px var(--p1),0 0 44px var(--p1),0 0 80px rgba(47,216,255,.5)}
.logo small{display:block;margin-top:12px;font:600 clamp(11px,2.6vw,14px)/1 var(--f);letter-spacing:.4em;color:var(--ink-2)}
.panel{width:min(560px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.opt>span{font:600 10px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.seg{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:rgba(10,8,18,.8)}
.seg button{flex:1;min-height:38px;border:0;background:transparent;color:var(--ink-2);font:600 12px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:0 4px}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:rgba(255,210,63,.16);color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.hint{margin:0;text-align:center;font:500 12px/1.45 var(--f);color:var(--ink-2)}
@media (max-aspect-ratio:1/1){.logo b{display:block;font-size:clamp(52px,16vw,96px)}}
body.embed .logo{margin-top:max(54px,7vh)}   /* clear of the arcade's ← Arcade pill */
@media (max-width:420px){.setts{grid-template-columns:1fr}.opt{flex-direction:row;align-items:center}.opt>span{width:72px;text-align:left}.seg{flex:1}}
@media (max-height:520px){.logo{margin-top:6px}.logo b{font-size:clamp(34px,9vh,64px)}.logo small{margin-top:6px}.panel{gap:8px}.mb.big{min-height:46px}}
/* the rivals */
#sRivals{justify-content:center;gap:14px;background:rgba(6,4,12,.72);backdrop-filter:blur(2px)}
#sRivals h2,#sOver h2{margin:0;font:italic 700 clamp(24px,6vw,34px)/1 var(--f);letter-spacing:.12em;text-transform:uppercase;text-align:center}
#cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(1040px,100%);max-height:calc(100% - 130px);overflow:auto;padding:4px}
.card{--c:#fff;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:170px;padding:16px 14px 14px;border-radius:16px;
  border:1px solid var(--edge);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(10,8,18,.92) 60%);color:var(--ink);cursor:pointer;overflow:hidden}
.card i{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);box-shadow:0 0 16px var(--c)}
.card b{font:italic 700 26px/1 var(--f);letter-spacing:.08em;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.card em{font:600 10px/1 var(--f);font-style:normal;letter-spacing:.24em;color:var(--ink)}
.card span{font:500 13px/1.4 var(--f);color:var(--ink-2)}
.card small{margin-top:auto;font:600 11px/1 var(--f);letter-spacing:.14em;color:var(--gold)}
.card:hover:not(.locked){border-color:var(--c)}
.card.locked{cursor:default;filter:grayscale(.85);opacity:.55}
.card.locked small{color:var(--ink-2)}
@media (max-width:860px){#cards{grid-template-columns:1fr 1fr}}
@media (max-width:520px){#cards{grid-template-columns:1fr;gap:8px}.card{min-height:0;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"b em" "s s" "sm sm";column-gap:12px;padding:12px 14px}
  .card b{grid-area:b;font-size:22px}.card em{grid-area:em;align-self:center}.card span{grid-area:s}.card small{grid-area:sm;margin-top:2px}}
/* the result */
#sOver{justify-content:center;background:radial-gradient(ellipse at center,rgba(6,4,12,.55),rgba(6,4,12,.88))}
.res{width:min(440px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;padding:20px 18px;border-radius:20px;border:1px solid var(--edge);background:rgba(14,10,24,.9);box-shadow:0 0 50px rgba(255,47,138,.16)}
#oT{--c:#fff;color:#fff;text-shadow:0 0 18px var(--c),0 0 40px var(--c)}
#oS{display:flex;justify-content:center;align-items:baseline;gap:16px;font:italic 700 64px/1 var(--f)}
#oS span{color:var(--ink-2);font-size:40px}
#oStats{display:grid;gap:4px;font:500 14px/1.3 var(--f)}
#oStats div{display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:center;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.03)}
#oStats div.hd{background:none;font:600 10px/1 var(--f);letter-spacing:.2em}
#oStats div.one{grid-template-columns:1.4fr 2fr}
#oStats span{text-align:left;color:var(--ink-2)}
#oTix{font:700 18px/1 var(--f);letter-spacing:.14em;color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.5)}
#oTix:empty,#oUnlock:empty{display:none}
#oUnlock{font:600 13px/1.4 var(--f);color:#7cff6a}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.btns .mb{flex:1 1 120px}
/* the pause menu */
#menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,3,12,.62);backdrop-filter:blur(3px);z-index:5}
#menu .box{min-width:250px;max-width:88vw;padding:22px 20px 16px;border-radius:18px;border:1px solid var(--edge);background:rgba(16,12,26,.94);box-shadow:0 0 40px rgba(255,47,138,.18);text-align:center}
#menu h2{margin:0 0 14px;font:700 20px/1 var(--f);letter-spacing:.3em;color:#fff;text-shadow:0 0 14px var(--p2)}
#menu .mb{display:flex;width:100%;margin:8px 0 0;min-height:42px}
#menu .mb.sm{display:inline-flex;width:auto;min-height:34px;padding:0 12px;font-size:10px;margin:8px 3px 0}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Air Hockey 3D"></canvas>
<div id="sa" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px)"></div>
<div class="bar">
  <span class="brand">AIR HOCKEY 3D<span>HYPERDOT ARCADE</span></span>
  <div class="opts"><button class="chip" id="dots" type="button" title="Show the 3D through LED dots">Dots</button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<button id="pz" type="button" aria-label="Pause">II</button>

<section class="scr" id="sTitle" hidden aria-label="Air Hockey 3D">
  <h1 class="logo"><b>AIR</b><b>HOCKEY</b><small>3D · HYPERDOT ARCADE</small></h1>
  <div class="panel">
    <div class="row2"><button class="mb big" id="b1p" type="button" data-focus>1 Player</button><button class="mb big" id="b2p" type="button">2 Players</button></div>
    <div class="setts">
      <div class="opt"><span>First to</span><div class="seg" data-k="to" role="group" aria-label="Goals to win"><button type="button" data-v="5">5</button><button type="button" data-v="7">7</button><button type="button" data-v="9">9</button></div></div>
      <div class="opt"><span>Rules</span><div class="seg" data-k="rules" role="group" aria-label="Rules"><button type="button" data-v="classic">Classic</button><button type="button" data-v="frenzy">Frenzy</button></div></div>
      <div class="opt"><span>Table</span><div class="seg" data-k="theme" role="group" aria-label="Table"><button type="button" data-v="classic">Classic</button><button type="button" data-v="neon">Neon</button></div></div>
    </div>
    <p class="hint" id="tHint"></p>
  </div>
</section>
<section class="scr" id="sRivals" hidden aria-label="Choose your rival">
  <h2>Choose your rival</h2>
  <div id="cards"></div>
  <button class="mb" id="bBack" type="button">Back</button>
</section>
<section class="scr" id="sOver" hidden aria-label="Result">
  <div class="res">
    <h2 id="oT">You win!</h2>
    <div id="oS"></div>
    <div id="oStats"></div>
    <div id="oTix"></div>
    <div id="oUnlock"></div>
    <div class="btns"><button class="mb big" id="oAgain" type="button" data-focus>Rematch</button><button class="mb big" id="oNext" type="button">Next rival</button></div>
    <div class="btns"><button class="mb" id="oMenu" type="button">Menu</button><button class="mb" id="oExit" type="button">Exit to arcade</button></div>
  </div>
</section>
<div id="menu" hidden><div class="box">
  <h2>PAUSED</h2>
  <button class="mb big" id="mRes" type="button">Resume</button>
  <button class="mb" id="mRe" type="button">Restart match</button>
  <button class="mb" id="mQuit" type="button">Quit to menu</button>
  <div><button class="mb sm" id="mTh" type="button">Table: classic</button><button class="mb sm" id="mQ" type="button">Graphics: auto</button><button class="mb sm" id="mDots" type="button">Dots: off</button><button class="mb sm" id="mSnd" type="button">Sound: on</button><button class="mb sm" id="mVo" type="button">Voice: on</button></div>
  <button class="mb" id="mEx" type="button">Exit to arcade</button>
</div></div>
<div id="err">This game needs WebGL2, which this browser has turned off.</div>
<script>

/* =====================================================================================

        With the air off it scrubs to a stop.

        a fast flick can't pass through the puck.

/* =====================================================================================
   2. THE RIVALS — five CPU players, each with a style. A CPU moves a hand the way a person
      does: it has a top speed and an acceleration, it sees the puck a moment late (react)
      and guesses ahead, and its aim wavers (err). It plans each touch:
      - home: back in front of its goal, leaning toward the puck
      - defend: a shot is coming; it reads the bounces and steps into the line
      - attack: the puck is on its side; it gets behind it and strikes, straight or off a rail
      - counter: a slow puck is coming; it meets it and hits it back on the way
      Pure: it reads the physics and writes the mallet's target, like a player's hand would.
   ===================================================================================== */
const RIVALS=[
  {id:'pixel',name:'PIXEL',tag:'ROOKIE',line:'Just learning. Slow hands, soft shots.',col:'#7cff6a',col2:'#1fae46',

  {id:'blitz',name:'BLITZ',tag:'THE SLAMMER',line:'Hits everything as hard as it can. Leaves the door open.',col:'#ffb020',col2:'#ff5a10',
   vmax:2.7,amax:16,react:.22,err:.15,pnoise:.08,power:4.9,aggr:.95,bank:.12,depth:.34,wait:.12,wobble:.03,counter:.5},
  {id:'brick',name:'BRICK',tag:'THE WALL',line:'Almost impossible to score on. Waits for your mistake.',col:'#4fa8ff',col2:'#2a54d8',
   vmax:3.1,amax:22,react:.15,err:.12,pnoise:.04,power:3.0,aggr:.3,bank:.15,depth:.15,wait:.5,wobble:.015,counter:.15},
  {id:'rico',name:'RICO',tag:'BANK SHOTS',line:'Plays the rails. Watch the angles.',col:'#c27aff',col2:'#7a36e0',
   vmax:3.3,amax:24,react:.13,err:.08,pnoise:.035,power:4.2,aggr:.65,bank:.75,depth:.2,wait:.22,wobble:.012,counter:.4},
  {id:'apex',name:'APEX',tag:'CHAMPION',line:'Fast, sharp, no wasted moves. Beat APEX, own the table.',col:'#ff3a5c',col2:'#c8102e',

const DEMO_A=Object.assign({},RIVALS[3],{name:'RICO'}),DEMO_B=Object.assign({},RIVALS[1],{name:'BLITZ'});

function mkAI(pi,rv,seed){
  const s=SIDE[pi];
  return {pi,s,rv,hx:0,hz:s*(TB.HL-rv.depth),hvx:0,hvz:0,mode:'home',mt:0,plan:null,strike:null,hist:[],rnd:mulberry(seed||(pi*7919+13)),
    adapt:0,wob:0,serveT:0,since:0,target:null,lastHitN:0};
}
/* the CPU's view of a puck: a moment old, then guessed forward (good players guess better) */
function aiSee(ai,P,p){

function aiRecord(ai,P){
  for(const p of P.pucks){let h=ai.hist[p.id];if(!h)h=ai.hist[p.id]=[];h.push({x:p.x,z:p.z,vx:p.vx,vz:p.vz,w:p.w,on:p.on});if(h.length>40)h.shift();}

const gauss=r=>{let a=0;for(let i=0;i<4;i++)a+=r();return (a-2)*1.22;};

function handTo(ai,x,z,dt,vcap){

  let vdx=0,vdz=0;if(d>1e-4){const v=Math.min(vm,Math.sqrt(2*am*d)*.92);vdx=dx/d*v;vdz=dz/d*v;}

function accel(ai,vdx,vdz,am,dt){

  ai.hvx+=ex;ai.hvz+=ez;ai.hx+=ai.hvx*dt;ai.hz+=ai.hvz*dt;
  const [cx,cz]=clampMallet(ai.s,ai.hx,ai.hz);if(cx!==ai.hx){ai.hvx=0;ai.hx=cx;}if(cz!==ai.hz){ai.hvz=0;ai.hz=cz;}

/* pick the puck that matters most: one on our side, or the one that will get here first */
function aiPick(ai,P){
  let best=null,bs=1e9;
  for(const p of P.pucks){if(!p.on)continue;const lz=ai.s*p.z,lvz=ai.s*p.vz;
    const sc=lz>0?(TB.HL-lz)*.5:(lvz>.05?(-lz)/lvz:5+(-lz));if(sc<bs){bs=sc;best=p;}}
  return best;
}
/* plan a shot from contact point (cx,cz): straight at the goal, or off a side rail */
function aiPlan(ai,cx,cz){
  const rv=ai.rv,r=ai.rnd,gz=-ai.s*(TB.HL+.02);
  let tx=(r()-.5)*TB.GW*.55,bank=r()<rv.bank,wall=0;
  if(bank){wall=Math.abs(cx)>.12?-Math.sign(cx):(r()<.5?-1:1);if(r()<.3)wall=-wall;
    const wx=wall*(TB.HW-TB.RP);tx=2*wx-tx;}            /* aim at the goal's mirror image in the rail */

function legalPt(ai,x,z){const [cx,cz]=clampMallet(ai.s,x,z);return Math.hypot(cx-x,cz-z)<.012;}

  if(Math.hypot(m.x-ai.hx,m.z-ai.hz)>.05){ai.hx=m.x;ai.hz=m.z;ai.hvx*=.3;ai.hvz*=.3;}
  const live=aiPick(ai,P);
  if(!live||!P.air){ai.mode='home';ai.strike=null;ai.plan=null;home();return out();}
  const q=aiSee(ai,P,live),lz=s*q.z,lvz=s*q.vz,sp=Math.hypot(q.vx,q.vz);

  if(ai.strike){const k=ai.strike;k.t+=dt;
    if(k.t<0){handTo(ai,k.cx-k.dx*(R+.03),k.cz-k.dz*(R+.03),dt,rv.vmax*1.1);return out();}   /* a counter waits for the puck */
    const past=(ai.hx-k.cx)*k.dx+(ai.hz-k.cz)*k.dz;
    if(k.t>.32||past>.13||live.last===ai.pi&&P.hits!==ai.lastHitN&&k.t>.03){ai.strike=null;ai.plan=null;ai.mode='recover';ai.mt=0;ai.lastHitN=P.hits;}
    else{const v=rv.power*(1+ai.adapt*.6);accel(ai,k.dx*v,k.dz*v,rv.amax*2.2,dt);return out();}
  }

  if(own){
    const coming=lvz>.6;

    if(coming&&s*ai.hz<lz+.02&&lvz>1.0){ai.mode='defend';
      const pr=predictCross(q,s,HL-.08,1.2),gx=pr?clamp(pr.x,-TB.GW/2-.02,TB.GW/2+.02):0;

/* the blower: looped noise through a lowpass (the rush of air), a thin hiss from the holes, and the motor's hum.

function airInit(){

    const mk=(type,f,q)=>{const s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;s.playbackRate.value=.97+Math.random()*.06;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AU.sfx);s.start();return {fl,g};};
    const rush=mk('lowpass',380,.7),hiss=mk('bandpass',6200,.8),glide=mk('highpass',5200,.6);
    const o=c.createOscillator();o.type='triangle';o.frequency.value=118;const og=c.createGain();og.gain.value=0;o.connect(og);og.connect(AU.sfx);o.start();

function airTick(dt,want,glide){

/* ---------- the human hands: a pointer puts the mallet where you point; keys and sticks push it ---------- */
const _ray=new THREE.Raycaster(),_ndc=new THREE.Vector2(),_hit=new THREE.Vector3(),DECKPL=new THREE.Plane(new THREE.Vector3(0,1,0),-(TB.DECK+.03));
function screenToDeck(cx,cy){

  return _ray.ray.intersectPlane(DECKPL,_hit)?{x:_hit.x,z:_hit.z}:null;

const _pv=new THREE.Vector3();

function awayDir(pi){const a=deckToScreen(0,SIDE[pi]*TB.HL),b=deckToScreen(0,0),dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return [dx/l,dy/l];}

/* ---------- one tick of the match ---------- */
function gameTick(dt){
  const P=G.P;G.pt+=dt;
  if(G.msg){G.msg.t+=dt;if(G.msg.t>G.msg.dur)G.msg=null;}
  if(G.big){G.big.t+=dt;if(G.big.t>G.big.dur)G.big=null;}
  if(G.replay){replayTick(dt);return;}
  /* the hands move in every phase, so you can get ready */
  for(let i=0;i<2;i++){if(G.pl[i].human){if(G.auto&&G.auto[i])aiTick(G.auto[i],P,dt);else if(S.mode==='play')humanTick(i,dt);else malletAim(P.mal[i],P.mal[i].x,P.mal[i].z,dt);}else aiTick(G.ai[i],P,dt);}

  for(const p of P.pucks)if(p.drop!=null&&p.drop<1)p.drop=Math.min(1,p.drop+dt*4);

    if(e.t==='mallet'){const k=clamp(e.imp/5,0,1);SFX.clack(k);fxHit(e.x,e.z,plCol(e.who),k);G.stats.hits[e.who]++;
      if(G.lastTouch!==e.who&&G.lastTouch>=0){G.stats.rally++;G.stats.longest=Math.max(G.stats.longest,G.stats.rally);}G.lastTouch=e.who;
      if(k>.6)S.shake=Math.max(S.shake,(k-.6)*.5);

    else if(e.t==='wall'){SFX.rail(clamp(e.imp/4,0,1));if(e.imp>1.5)fxSpark(e.x,e.z,'#ffffff',clamp(e.imp/6,0,1)*.6);}
    else if(e.t==='post'){SFX.post(clamp(e.imp/4,0,1));fxSpark(e.x,e.z,'#ffffff',.6);}
    else if(e.t==='puck')SFX.puck(clamp(e.imp/3,0,1));

  }

    }

  else if(G.ph==='end'){if(G.pt>(G.demo?1.2:1.4)){if(!G.demo&&wantReplay())startReplay();else matchOver();}}
}
/* ---------- the instant replay: the last few seconds, slowed, from a low angle ---------- */
function record(){

/* ---------- the end of a match: tickets, unlocks, the card ---------- */

  requestAnimationFrame(()=>{const b=document.querySelector('.scr:not([hidden]) [data-focus]')||document.querySelector('.scr:not([hidden]) button:not([disabled])');if(b&&!touchy)try{b.focus({preventScroll:true});}catch(e){}});}
function uiHide(){UI.scr=null;for(const s of document.querySelectorAll('.scr'))s.hidden=true;document.body.classList.remove('inmenu');try{cv.focus({preventScroll:true});}catch(e){}}
function segSync(){for(const sg of document.querySelectorAll('.seg')){const k=sg.dataset.k,v=k==='to'?String(G.to):k==='rules'?G.rules:THEME;

function titleSync(){segSync();$('tHint').textContent=touchy?'Drag your mallet. Two players: each drags on their own half.':'Mouse, arrows, WASD or a gamepad. Two players: P1 mouse or arrows, P2 WASD.';}

  if(k==='to'){G.to=+v;store.set('hd-'+CAB.id+'-to',G.to);}

function stars(n){return n>0?'★'.repeat(Math.min(5,n))+(n>5?' ×'+n:''):'';}
function rivalsBuild(){
  const box=$('cards');box.innerHTML='';
  RIVALS.forEach((rv,i)=>{const lock=i>BEAT+1,wins=+store.get('hd-'+CAB.id+'-wins-'+rv.id,'0')||0;
    const b=document.createElement('button');b.type='button';b.className='card'+(lock?' locked':'');b.style.setProperty('--c',rv.col);b.disabled=lock;
    b.innerHTML='<i></i><b></b><em></em><span></span><small></small>';
    b.querySelector('b').textContent=rv.name;b.querySelector('em').textContent=rv.tag;
    b.querySelector('span').textContent=lock?'Beat '+RIVALS[i-1].name+' to unlock.':rv.line;
    b.querySelector('small').textContent=lock?'LOCKED':wins?stars(wins)+'  beaten':i===BEAT+1?'NEXT UP':'';
    if(i===G.ri&&!lock)b.dataset.focus='1';
    b.addEventListener('click',()=>{if(lock)return;audioInit();SFX.confirm();G.ri=i;store.set('hd-'+CAB.id+'-rival',i);APP_start();});
    box.appendChild(b);});
}
function overBuild(){
  const r=G.result;if(!r)return;const me=!G.two,w=r.w;
  const head=G.two?(w===0?'P1 WINS':'P2 WINS'):w===0?(r.champ?'CHAMPION!':'YOU WIN!'):plName(1)+' WINS';
  $('oT').textContent=head;$('oT').style.setProperty('--c',plCol(w));
  $('oS').innerHTML='';const s0=document.createElement('b'),s1=document.createElement('b'),dash=document.createElement('span');
  s0.textContent=r.score[0];s1.textContent=r.score[1];dash.textContent='–';s0.style.color=plCol(0);s1.style.color=plCol(1);$('oS').append(s0,dash,s1);
  const st=r.stats,row=(k,a,b)=>'<div><span>'+k+'</span><b style="color:'+plCol(0)+'">'+a+'</b><b style="color:'+plCol(1)+'">'+b+'</b></div>';
  $('oStats').innerHTML='<div class="hd"><span></span><b>'+(G.two?'P1':'YOU')+'</b><b>'+plName(1)+'</b></div>'+
    row('Top shot',MPH(st.top[0]).toFixed(0)+' mph',MPH(st.top[1]).toFixed(0)+' mph')+row('Hits',st.hits[0],st.hits[1])+row('Bank goals',st.banks[0],st.banks[1])+
    '<div class="one"><span>Longest rally</span><b>'+st.longest+'</b></div>';
  $('oTix').textContent=r.tix>0?'+'+r.tix+' tickets':'';
  $('oUnlock').textContent=r.unlocked?'New rival unlocked: '+r.unlocked:r.champ?'You beat APEX. The table is yours.':'';
  $('oNext').hidden=!(me&&w===0&&G.ri<4);$('oAgain').textContent=me&&w===1?'Try again':'Rematch';
  $('oExit').hidden=!EMBED;
}
/* ---------- the pause menu ---------- */
function setPause(on){if(S.mode!=='play'||G.demo)on=false;S.paused=on;$('menu').hidden=!on;document.body.classList.toggle('paused',on);if(on){menuSync();requestAnimationFrame(()=>{if(!touchy)try{$('mRes').focus({preventScroll:true});}catch(e){}});}}
function toggleSound(){AU.muted=!AU.muted;store.set('hd-'+CAB.id+'-mute',AU.muted?'1':'0');setVolume();menuSync();try{if(AU.muted)speechSynthesis.cancel();}catch(e){}}
function toggleDots(){DOTS=!DOTS;store.set('hd-'+CAB.id+'-dots',DOTS?'1':'0');menuSync();}
function toggleVoice(){VOICE=!VOICE;store.set('hd-'+CAB.id+'-voice',VOICE?'1':'0');menuSync();}
function cycleQ(){const order=[null,0,1,2],i=order.indexOf(QPIN);QPIN=order[(i+1)%4];store.set('hd-'+CAB.id+'-q',QPIN==null?'auto':String(QPIN));setQuality(QPIN==null?QSTART:QPIN);T.frames=0;menuSync();}
function menuSync(){
  $('snd').textContent=AU.muted?'Sound off':'Sound on';$('mSnd').textContent=AU.muted?'Sound: off':'Sound: on';$('mVo').textContent=VOICE?'Voice: on':'Voice: off';
  $('mDots').textContent=DOTS?'Dots: on':'Dots: off';$('mQ').textContent='Graphics: '+(QPIN==null?'auto ('+QP[QL].name.toLowerCase()+')':QP[QPIN].name.toLowerCase());
  $('mTh').textContent='Table: '+(THEME==='neon'?'neon':'classic');
}
/* spatial focus: arrows move to the nearest button that way */
function focusMove(dx,dy){
  const vis=[...document.querySelectorAll('#menu:not([hidden]) button, .scr:not([hidden]) button')].filter(b=>!b.disabled&&!b.hidden&&b.offsetParent);
  if(!vis.length)return;const a=document.activeElement;if(!vis.includes(a)){vis[0].focus();return;}
  const r=a.getBoundingClientRect(),ax=r.x+r.width/2,ay=r.y+r.height/2;let best=null,bs=1e9;
  for(const b of vis){if(b===a)continue;const q=b.getBoundingClientRect(),bx=q.x+q.width/2,by=q.y+q.height/2,ddx=bx-ax,ddy=by-ay;
    const along=ddx*dx+ddy*dy;if(along<=4)continue;const off=Math.abs(ddx*dy)+Math.abs(ddy*dx),sc=along+off*2.2;if(sc<bs){bs=sc;best=b;}}
  if(best){best.focus();SFX.select();}
}
const btn=(id,f)=>$(id).addEventListener('click',e=>{audioInit();const t=e.currentTarget;f(e);if(touchy)t.blur();});
function uiInit(){
  btn('b1p',()=>{SFX.confirm();uiShow('rivals');});
  btn('b2p',()=>{SFX.confirm();APP_start2();});
  btn('bBack',()=>{SFX.back();uiShow('title');});
  for(const sg of document.querySelectorAll('.seg'))for(const b of sg.querySelectorAll('button'))b.addEventListener('click',()=>{audioInit();SFX.select();setOpt(sg.dataset.k,b.dataset.v);});
  btn('oAgain',()=>{SFX.confirm();G.two?APP_start2():APP_start();});
  btn('oNext',()=>{SFX.confirm();G.ri=Math.min(4,G.ri+1);store.set('hd-'+CAB.id+'-rival',G.ri);APP_start();});
  btn('oMenu',()=>{SFX.back();APP_attract();});
  btn('oExit',()=>ARC.exit());
  btn('snd',toggleSound);btn('dots',toggleDots);btn('pz',()=>setPause(!S.paused));btn('pauseBtn',()=>setPause(!S.paused));
  btn('mRes',()=>setPause(false));btn('mRe',()=>{setPause(false);G.two?APP_start2():APP_start();});btn('mQuit',()=>{setPause(false);APP_attract();});
  btn('mTh',()=>setOpt('theme',THEME==='neon'?'classic':'neon'));btn('mDots',toggleDots);btn('mQ',cycleQ);btn('mSnd',toggleSound);btn('mVo',toggleVoice);btn('mEx',()=>{setPause(false);ARC.exit();});
  $('mEx').hidden=!EMBED;
}
/* ---- 30_loop.js ---- */
/* =====================================================================================
   30. FRAME LOOP — fixed 60 Hz game ticks (the physics substeps 8 times inside each),
       one 3D render per display frame, the frame-rate watch that steps quality down, the
       keys and gamepad buttons for the menus, and boot.
   ===================================================================================== */
const UIP={},T={fps:60,ms:16.7,bad:0,good:0,frames:0};
function tick(dt){
  const mk=menuKeys(),e={};for(const k in mk){e[k]=mk[k]&&!UIP[k];UIP[k]=mk[k];}
  /* d-pad and arrows move between buttons whenever a menu is up */
  const menuUp=!!UI.scr||S.paused;
  if(menuUp){const dirs={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},st={u:K('ArrowUp'),d:K('ArrowDown'),l:K('ArrowLeft'),r:K('ArrowRight')};
    for(const p of pads()){const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),ly=p.axes[1]||0,lx=p.axes[0]||0;if(b(12)||ly<-.6)st.u=true;if(b(13)||ly>.6)st.d=true;if(b(14)||lx<-.6)st.l=true;if(b(15)||lx>.6)st.r=true;
      if(b(0)&&!UIP.padA){const a=document.activeElement;if(a&&a.tagName==='BUTTON')a.click();}UIP.padA=b(0);}
    for(const k in st){if(st[k]&&!UIP['n'+k])focusMove(dirs[k][0],dirs[k][1]);UIP['n'+k]=st[k];}}
  S.t+=dt;U.uT.value=S.t;
  if(S.mode==='title'){gameTick(dt);
    if(e.back){if(UI.scr==='rivals'){SFX.back();uiShow('title');}else if(EMBED)ARC.exit();}}
  else if(S.mode==='play'){
    if(e.pause&&!G.replay)setPause(!S.paused);
    else if(!S.paused)gameTick(dt);else airTick(dt,false,0);}
  else if(S.mode==='over'){S.ot+=dt;gameTick(dt);if(S.ot>1&&e.back)APP_attract();}
  camTick(dt);fxTick(dt);
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*2.4);if(S.flash>0)S.flash=Math.max(0,S.flash-dt*1.6);
  const d=Math.exp(-dt*1.8);LEDU.uFl0.value*=d;LEDU.uFl1.value*=d;if(LT.goalK)LT.goalK*=Math.exp(-dt*2.2);
}
/* ---------- physics (or the replay) -> meshes ---------- */
const PV=[];        /* what each puck slot shows this frame, for the trails */
const _q=new THREE.Quaternion(),_ax=new THREE.Vector3(),_up=new THREE.Vector3(0,1,0),_q2=new THREE.Quaternion();
function syncWorld(dt){
  const f=G.replay?replayFrame():null,P=G.P,th=THEMES[THEME];
  const pucks=f?f.p.map(a=>({x:a[0],z:a[1],ang:a[2],on:!!a[3],sink:a[4],sinkSide:a[5],sx:a[6],sz:a[7],hop:a[8],tilt:a[9],id:a[10],last:a[11],vx:0,vz:0,drop:1})):P.pucks;
  const mal=f?[[f.m[0],f.m[1]],[f.m[2],f.m[3]]]:[[P.mal[0].x,P.mal[0].z],[P.mal[1].x,P.mal[1].z]];
  for(let k=0;k<3;k++){const m=PUCK3[k],bl=BLOBS[k],L=LT.puck[k],p=pucks.find(q=>q.id===k);PV[k]=null;
    if(!p||(!p.on&&!(p.sink>0&&p.sink<.7))||S.mode==='title'&&false){m.visible=false;bl.visible=false;L.intensity=0;continue;}
    let x=p.x,y=TB.DECK+.0012+(p.hop||0),z=p.z;
    if(p.drop!=null&&p.drop<1){y+=Math.pow(1-p.drop,2)*.14;}
    if(!p.on){const s=p.sink;z=p.sinkSide*(TB.HL+Math.min(.06,s*.9));y=TB.DECK+.0012-Math.max(0,s-.06)*Math.max(0,s-.06)*4;x=clamp(x,-TB.GW/2+TB.RP,TB.GW/2-TB.RP);}
    m.visible=true;m.position.set(x,y,z);
    /* spin, plus a wobble after a hard hit */
    _q.setFromAxisAngle(_up,-p.ang);
    if(p.tilt>.01&&!reduce){const sp=Math.hypot(p.vx,p.vz)||1;_ax.set(-(p.vz||0)/sp,0,(p.vx||0)/sp);if(_ax.lengthSq()<.5)_ax.set(1,0,0);
      _q2.setFromAxisAngle(_ax,Math.sin(S.t*38)*p.tilt*.12);_q.premultiply(_q2);}
    m.quaternion.copy(_q);
    bl.visible=p.on;bl.position.set(x,TB.DECK+.0006,z);bl.material.opacity=.42/(1+(y-TB.DECK)*60);
    L.intensity=th.puckE>0&&p.on?.05:0;L.position.set(x,TB.DECK+.03,z);
    const sp=Math.hypot(p.vx,p.vz);PV[k]={x,z,spd:f?(p.on?3:0):sp,col:p.last>=0?plCol(p.last):'#ffffff',vis:p.on};
    if(f&&k<PV.length&&p.on){const pr=PV[k];pr.spd=T._lastRep&&T._lastRep[k]?Math.hypot(x-T._lastRep[k][0],z-T._lastRep[k][1])*60*G.replay.speed:0;}
  }
  if(f){T._lastRep=PV.map(p=>p&&[p.x,p.z]);}
  for(let i=0;i<2;i++){const m=MAL3[i],[x,z]=mal[i];m.position.set(x,TB.DECK+.0005,z);BLOBS[3+i].position.set(x,TB.DECK+.0006,z);}
  trailTick(dt,PV);
  /* the light show bits */
  const live=pucks.find(p=>p.on);
  if(live&&th.lineK>0){DU.uGlow.value.set(live.x,live.z,.35,.09);DU.uGlowC.value.set(live.last>=0?plCol(live.last):'#9ad8ff');}else DU.uGlow.value.z=0;
  LT.goal.intensity=(LT.goalK||0)*.35;
  for(const c of CHUTE){const fl=G.chuteFl&&G.chuteFl[0]===c.sz?LT.goalK||0:0;c.lm.color.copy(c.base).multiplyScalar(1.4+fl*6*(((S.t*10)|0)%2?1:.3));}
  BOARD.grp.visible=!((CAM.mode==='p1'||CAM.mode==='top')&&CAM.k>.5)&&UI.scr!=='title'&&S.mode!=='over';
  LEDU.uChase.value=S.mode==='title'?1:0;LEDU.uK.value=S.mode==='title'?1.2:1;
  M_COMP.uniforms.uFlash.value=reduce?0:S.flash*.25;
}
function render3d(dt){
  R.info.reset();syncWorld(dt||1/60);applyCam();hud();paintBoard(dt||1/60);
  if(MIRROR_ON())renderMirror(CAM3);else DU.uMirOn.value=0;
  R.setRenderTarget(RT.scene);R.render(SCENE,CAM3);
  post();
}
const MIRROR_ON=()=>!!MIR.rt;
/* frame-rate watch: if frames take too long for a couple of seconds, drop a level (never while pinned) */
function qualityTick(dt){
  T.frames++;T.ms+=(dt*1000-T.ms)*.05;if(T.frames<90||QPIN!=null||S.paused)return;
  if(T.ms>24){T.bad+=dt;T.good=0;}else if(T.ms<13){T.good+=dt;T.bad=0;}else{T.bad=Math.max(0,T.bad-dt);T.good=0;}
  if(T.bad>2.2&&QL>0){setQuality(QL-1);T.bad=0;T.frames=0;T.ms=16.7;menuSync();}
  if(T.good>10&&QL<QSTART){setQuality(QL+1);T.good=0;T.frames=0;menuSync();}
}
let ACC=0,LAST=0,NOREN=false,FIRST=true;
function frame(ts){
  const dt=LAST?Math.min(.05,(ts-LAST)/1000):1/60;LAST=ts;
  ACC+=dt;let n=0;while(ACC>=1/60&&n<4){tick(1/60);ACC-=1/60;n++;}if(n===4)ACC=0;
  if(n>0)endInputFrame();
  if(R&&!NOREN){render3d(dt);qualityTick(dt);}
  musicTick(S.paused);
  if(FIRST){FIRST=false;ARC.post('ready',{title:CAB.title,tickets:CAB.tickets});}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);});
addEventListener('resize',()=>{resize();camFits();});
if(EMBED)document.body.classList.add('embed');if(touchy)document.body.classList.add('touch');
/* ---------- boot ---------- */
if(!GL_OK){$('err').style.display='grid';}
else{
  resize();worldInit();fxInit();uiInit();camFits();menuSync();APP_attract();
    requestAnimationFrame(frame);
}
})();
