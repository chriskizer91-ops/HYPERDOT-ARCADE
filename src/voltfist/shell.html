<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyperdot Voltfist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one-screen LED-matrix fighting game. The matrix sits in a dark bezel; on phones held upright an arcade control panel (stick + four buttons) sits under it, held sideways the controls float over the bottom corners. Dark-only by design. */
:root{
  --bg:#07050b;
  --ink:#f3ecff;
  --ink-2:#a69cba;
  --volt:#ffd23f;
  --cyan:#2fe6ff;
  --pink:#ff2f9a;
  --panel:rgba(16,12,26,.8);
  --edge:rgba(255,255,255,.14);
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 14px/1 var(--f);letter-spacing:.32em;color:var(--volt);text-shadow:0 0 12px rgba(255,210,63,.6);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
@media (max-width:560px){.brand span{display:none}}
@media (max-width:440px){.brand{font-size:12px;letter-spacing:.2em}.opts{gap:6px}.chip{padding:0 9px;font-size:10px;letter-spacing:.06em}.chip .lbl{display:none}}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:focus-visible,.fb:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none;
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stick{pointer-events:auto;touch-action:none;position:relative;flex:none;width:var(--stick,150px);height:var(--stick,150px);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0 30%,transparent 31%),var(--panel);border:1px solid var(--edge)}
#stick i{position:absolute;width:0;height:0;border:6px solid transparent;opacity:.45}
#stick i:nth-child(1){left:50%;top:7%;margin-left:-6px;border-bottom-color:var(--ink)}
#stick i:nth-child(2){left:50%;bottom:7%;margin-left:-6px;border-top-color:var(--ink)}
#stick i:nth-child(3){top:50%;left:7%;margin-top:-6px;border-right-color:var(--ink)}
#stick i:nth-child(4){top:50%;right:7%;margin-top:-6px;border-left-color:var(--ink)}
#knob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#ff7cc4,#c0156a 62%,#5a0830);box-shadow:0 0 16px rgba(255,47,154,.45),inset 0 -3px 0 rgba(0,0,0,.3)}
.btns{pointer-events:auto;display:grid;grid-template-columns:repeat(2,var(--b,66px));gap:var(--bg-gap,12px);transform:rotate(-8deg)}
.fb{touch-action:none;cursor:pointer;width:var(--b,66px);height:var(--b,66px);border-radius:50%;border:1px solid var(--edge);color:var(--ink);
  font:700 10px/1 var(--f);letter-spacing:.08em;display:grid;place-items:center;background:var(--panel);padding:0;transition:transform .05s}
.fb.p{background:radial-gradient(circle at 50% 34%,rgba(255,47,154,.6),var(--panel) 74%);border-color:rgba(255,47,154,.65)}
.fb.k{background:radial-gradient(circle at 50% 34%,rgba(47,230,255,.55),var(--panel) 74%);border-color:rgba(47,230,255,.65)}
.fb.s{background:radial-gradient(circle at 50% 34%,rgba(255,210,63,.55),var(--panel) 74%);border-color:rgba(255,210,63,.65)}
.fb.x{color:var(--ink-2)}
.fb.x.ready{color:#1a1200;background:radial-gradient(circle at 50% 34%,#fff6c8,#ffc21a 70%);border-color:#fff;animation:ready 1s ease-in-out infinite}
.fb.on{transform:scale(.9);filter:brightness(1.5)}
@keyframes ready{0%,100%{box-shadow:0 0 10px rgba(255,210,63,.4)}50%{box-shadow:0 0 28px rgba(255,210,63,.95)}}
body.portrait #pad{top:var(--padTop,60%);align-items:center}
body.land #pad{opacity:.78}
.keys{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 11px/1.5 var(--f);letter-spacing:.08em;color:var(--ink-2);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.keys b{color:var(--ink);font-weight:600}
#turn{position:fixed;left:0;right:0;margin:0;text-align:center;font:500 11px/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.fb.x.ready{animation:none}}
/* embedded in the 3D arcade (?embed=1): no top bar, key hints or rotate hint; the matrix fills the frame */
body.embed .bar,body.embed .keys,body.embed #turn{display:none!important}
</style>
</head>
<body>
<canvas id="gl" aria-label="Voltfist: a fighting game on a color LED dot matrix"></canvas>
<div id="sa"></div>
<div class="bar">
  <span class="brand">VOLTFIST<span>LED MATRIX FIGHTER</span></span>
  <div class="opts"><button class="chip" id="res" type="button"><span class="lbl">Dots </span><span id="resv">384×216</span></button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<div id="pad" hidden>
  <div id="stick" aria-label="Movement stick"><i></i><i></i><i></i><i></i><div id="knob"></div></div>
  <div class="btns">
    <button class="fb p" id="bP" type="button">PUNCH</button><button class="fb k" id="bK" type="button">KICK</button>
    <button class="fb s" id="bS" type="button">SPECIAL</button><button class="fb x" id="bX" type="button">SUPER</button>
  </div>
</div>
<p id="turn" hidden>Turn your phone sideways for a bigger screen</p>
<p class="keys" id="keys"><b>WASD</b> or <b>arrows</b> move · <b>J</b> punch · <b>K</b> kick · <b>L</b> special · <b>I</b> super · <b>Enter</b> select · <b>Esc</b> pause</p>
<div id="err">This game needs WebGL2, which this browser has turned off.</div>

<script>
(()=>{
'use strict';
/*@@CODE@@*/
})();
</script>
</body>
</html>
