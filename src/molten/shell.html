<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Molten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* =====================================================================================
   HYPERDOT CABINET STARTER
   One self-contained page: an offscreen W x H "matrix" canvas is drawn by the game, then
   shown through a WebGL2 LED shader (round dots + bloom + tonemap). Everything visual is
   drawn by code; all sound is synthesized. Copy this file, rename it, replace the GAME
   section near the bottom. Dark-only by design (it is a lit sign in a dark arcade).
   ===================================================================================== */
:root{
  --bg:#080506;--ink:#f6ece6;--ink-2:#b4a39c;--accent:#ff8a30;--accent-2:#7fe4ff;
  --panel:rgba(24,14,12,.82);--edge:rgba(255,255,255,.14);
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;color-scheme:dark;
}
[hidden]{display:none!important}           /* author display rules would otherwise beat the hidden attribute */
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 14px/1 var(--f);letter-spacing:.32em;color:var(--accent);text-shadow:0 0 12px rgba(255,138,48,.6);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
@media (max-width:560px){.brand span{display:none}}
@media (max-width:440px){.brand{font-size:12px;letter-spacing:.2em}.opts{gap:6px}.chip{padding:0 9px;font-size:10px;letter-spacing:.06em}.chip .lbl{display:none}}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:focus-visible,.ab:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
/* touch controls: a stick on the left, two buttons on the right (phones only) */
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stk{pointer-events:auto;touch-action:none;position:relative;flex:none;width:var(--stick,150px);height:var(--stick,150px);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0 30%,transparent 31%),var(--panel);border:1px solid var(--edge)}
.kn{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:radial-gradient(circle at 40% 32%,#ffe0b0,#d0601a 62%,#4a1606);box-shadow:0 0 16px rgba(255,138,48,.45)}
.acts{pointer-events:auto;display:flex;gap:12px;align-items:flex-end}
.ab{touch-action:none;cursor:pointer;width:var(--b,64px);height:var(--b,64px);border-radius:50%;border:1px solid var(--edge);color:var(--ink);background:var(--panel);
  font:700 11px/1 var(--f);letter-spacing:.06em;display:grid;place-items:center;padding:0;transition:transform .05s}
#bA{border-color:rgba(255,150,60,.75);background:radial-gradient(circle at 50% 34%,rgba(255,150,60,.55),var(--panel) 74%);width:calc(var(--b,64px)*1.25);height:calc(var(--b,64px)*1.25)}
#bB{border-color:rgba(127,228,255,.6);background:radial-gradient(circle at 50% 34%,rgba(127,228,255,.35),var(--panel) 74%)}
.ab.on{transform:scale(.9);filter:brightness(1.5)}
body.portrait #pad{top:var(--padTop,60%);align-items:center}
body.land #pad{opacity:.8}
.keys{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 11px/1.5 var(--f);letter-spacing:.08em;color:var(--ink-2);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.keys b{color:var(--ink);font-weight:600}
#turn{position:fixed;left:0;right:0;margin:0;text-align:center;font:500 11px/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
/* embedded in the 3D arcade: no page chrome, the matrix fills the frame */
body.embed .bar,body.embed .keys,body.embed #turn{display:none!important}
</style>
</head>
<body>
<canvas id="gl" aria-label="Molten: defend a forge from creatures of ice by pouring molten iron, on a simulated LED matrix"></canvas>
<div id="sa"></div>
<div class="bar">
  <span class="brand" id="brand">MOLTEN<span>EVERY DOT IS MATTER</span></span>
  <div class="opts"><button class="chip" id="res" type="button"><span class="lbl">Light </span><span id="resv">HIGH</span></button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<div id="pad" hidden>
  <div class="stk" id="stL" aria-label="Stick"><div class="kn" id="knL"></div></div>
  <div class="acts"><button class="ab" id="bB" type="button">BOMB</button><button class="ab" id="bA" type="button">POUR</button></div>
</div>
<p id="turn" hidden>Turn your phone sideways for a bigger screen</p>
<p class="keys" id="keys"><b>A D</b>, <b>arrows</b> or <b>mouse</b> move · hold <b>Space</b> or <b>click</b> to pour · <b>X</b> or <b>right click</b> bomb · <b>Esc</b> pause · <b>M</b> mute</p>
<div id="err">MOLTEN lights its world on the graphics card and needs WebGL2, which this browser has turned off.</div>
<script>
(()=>{
'use strict';
/*@@CODE@@*/
})();
</script>
</body>
</html>
