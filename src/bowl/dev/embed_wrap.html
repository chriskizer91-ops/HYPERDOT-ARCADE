<!doctype html><html><head><meta charset="utf-8"><title>embed test</title>
<style>html,body{margin:0;background:#111;height:100%}iframe{border:0;width:800px;height:450px;display:block;margin:20px auto}</style></head>
<body><iframe id="f" src="../bowl.html?embed=1&q=0"></iframe>
<script>window.MSGS=[];addEventListener('message',e=>{if(e.data&&e.data.src==='hyperdot')MSGS.push(e.data);});
