<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyperdot Ironhowl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one-screen LED-matrix twin-stick mech shooter. Matrix in a dark bezel; on phones held upright two sticks and three action buttons sit under it, sideways they float over the bottom corners. Dark-only by design. */
:root{
  --bg:#08070a;
  --ink:#f2ede6;
  --ink-2:#a89e92;
  --amber:#ffae2a;
  --cyan:#2fe6ff;
  --red:#ff4a3a;
  --panel:rgba(20,16,12,.8);
  --edge:rgba(255,255,255,.14);
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 14px/1 var(--f);letter-spacing:.32em;color:var(--amber);text-shadow:0 0 12px rgba(255,174,42,.55);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
@media (max-width:560px){.brand span{display:none}}
@media (max-width:440px){.brand{font-size:12px;letter-spacing:.2em}.opts{gap:6px}.chip{padding:0 9px;font-size:10px;letter-spacing:.06em}.chip .lbl{display:none}}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:focus-visible,.ab:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stk{pointer-events:auto;touch-action:none;position:relative;flex:none;width:var(--stick,150px);height:var(--stick,150px);border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0 30%,transparent 31%),var(--panel);border:1px solid var(--edge)}
.stk b{position:absolute;left:0;right:0;top:-18px;text-align:center;font:600 10px/1 var(--f);letter-spacing:.18em;color:var(--ink-2)}
.kn{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
#knL{background:radial-gradient(circle at 40% 32%,#ffd27a,#d07a10 62%,#5a3006);box-shadow:0 0 16px rgba(255,174,42,.4)}
#knR{background:radial-gradient(circle at 40% 32%,#ff9a8a,#c02a1a 62%,#5a0a06);box-shadow:0 0 16px rgba(255,74,58,.45)}
.acts{pointer-events:auto;display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:6px}
.ab{touch-action:none;cursor:pointer;width:var(--b,56px);height:var(--b,56px);border-radius:50%;border:1px solid var(--edge);color:var(--ink);background:var(--panel);
  font:700 9px/1 var(--f);letter-spacing:.06em;display:grid;place-items:center;padding:0;transition:transform .05s}
#bM{border-color:rgba(255,174,42,.6);background:radial-gradient(circle at 50% 34%,rgba(255,174,42,.5),var(--panel) 74%)}
#bD{border-color:rgba(47,230,255,.6);background:radial-gradient(circle at 50% 34%,rgba(47,230,255,.45),var(--panel) 74%)}
#bH{color:var(--ink-2)}
#bH.ready{color:#1a0c00;background:radial-gradient(circle at 50% 34%,#fff0c8,#ffae2a 70%);border-color:#fff;animation:ready 1s ease-in-out infinite}
.ab.on{transform:scale(.9);filter:brightness(1.5)}
@keyframes ready{0%,100%{box-shadow:0 0 10px rgba(255,174,42,.4)}50%{box-shadow:0 0 28px rgba(255,174,42,.95)}}
body.portrait #pad{top:var(--padTop,60%);align-items:center}
body.land #pad{opacity:.78}
body.land .acts{flex-direction:row;position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + var(--stick,140px) + 10px);bottom:max(16px,env(safe-area-inset-bottom,0px))}
.keys{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 11px/1.5 var(--f);letter-spacing:.08em;color:var(--ink-2);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.keys b{color:var(--ink);font-weight:600}
#turn{position:fixed;left:0;right:0;margin:0;text-align:center;font:500 11px/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){#bH.ready{animation:none}}
/* embedded in the 3D arcade (?embed=1): no top bar, key hints or rotate hint; the matrix fills the frame */
body.embed .bar,body.embed .keys,body.embed #turn{display:none!important}
</style>
</head>
<body>
<canvas id="gl" aria-label="Ironhowl: a mech arena shooter on a color LED dot matrix"></canvas>
<div id="sa"></div>
<div class="bar">
  <span class="brand">IRONHOWL<span>LED MATRIX MECH ARENA</span></span>
  <div class="opts"><button class="chip" id="res" type="button"><span class="lbl">Dots </span><span id="resv">384×216</span></button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<div id="pad" hidden>
  <div class="stk" id="stL" aria-label="Move stick"><b>MOVE</b><div class="kn" id="knL"></div></div>
  <div class="acts"><button class="ab" id="bH" type="button">HOWL</button><button class="ab" id="bM" type="button">MISSILE</button><button class="ab" id="bD" type="button">DASH</button></div>
  <div class="stk" id="stR" aria-label="Aim and fire stick"><b>AIM + FIRE</b><div class="kn" id="knR"></div></div>
</div>
<p id="turn" hidden>Turn your phone sideways for a bigger screen</p>
<p class="keys" id="keys"><b>WASD</b> move · <b>mouse</b> aim · <b>click</b> fire · <b>right-click</b> or <b>Space</b> missiles · <b>Shift</b> dash · <b>E</b> howl · no mouse? <b>arrows</b> aim and fire · <b>Esc</b> pause</p>
<div id="err">This game needs WebGL2, which this browser has turned off.</div>

<script>
(()=>{
'use strict';
/*@@CODE@@*/
})();
</script>
</body>
</html>
