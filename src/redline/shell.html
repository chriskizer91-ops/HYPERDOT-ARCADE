<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redline Grand Prix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* =====================================================================================
   HYPERDOT CABINET: REDLINE
   A sprite-scaler racer (the classic segment-road technique) on a full-colour LED matrix,
   with a real racing model underneath: closed circuits with racing lines and braking
   zones, seven rival drivers, slipstream, tyre grip and steering assists.
   Dark-only by design: it is a lit sign in a dark arcade.
   ===================================================================================== */
:root{
  --bg:#060509;--ink:#f3ecff;--ink-2:#a69cba;--accent:#ff2a4a;--accent-2:#2fe6ff;
  --panel:rgba(16,12,26,.8);--edge:rgba(255,255,255,.14);
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;color-scheme:dark;
}
[hidden]{display:none!important}           /* author display rules would otherwise beat the hidden attribute */
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 14px/1 var(--f);letter-spacing:.32em;color:var(--accent);text-shadow:0 0 12px rgba(255,42,74,.65);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
@media (max-width:600px){.brand span{display:none}}
@media (max-width:440px){.brand{font-size:12px;letter-spacing:.18em}.opts{gap:5px}.chip{height:30px;padding:0 8px;font-size:9.5px;letter-spacing:.04em}.chip .lbl{display:none}}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:focus-visible,.ab:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
/* touch controls: a steering stick on the left; brake (big) and nitro on the right (phones only) */
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stk{pointer-events:auto;touch-action:none;position:relative;flex:none;width:var(--stick,150px);height:calc(var(--stick,150px)*.62);border-radius:999px;
  background:linear-gradient(90deg,rgba(255,255,255,.05),transparent 30% 70%,rgba(255,255,255,.05)),var(--panel);border:1px solid var(--edge)}
.stk::before{content:"";position:absolute;left:50%;top:18%;bottom:18%;width:1px;background:rgba(255,255,255,.12)}
.kn{position:absolute;left:50%;top:50%;width:30%;height:72%;transform:translate(-50%,-50%);border-radius:999px;
  background:radial-gradient(circle at 40% 32%,#ffd0d8,#ff2a4a 62%,#5a0614);box-shadow:0 0 16px rgba(255,42,74,.45)}
.acts{pointer-events:auto;display:flex;gap:12px;align-items:flex-end}
.ab{touch-action:none;cursor:pointer;width:var(--b,64px);height:var(--b,64px);border-radius:50%;border:1px solid var(--edge);color:var(--ink);background:var(--panel);
  font:700 11px/1 var(--f);letter-spacing:.06em;display:grid;place-items:center;padding:0;transition:transform .05s}
#bB{border-color:rgba(255,42,74,.75);background:radial-gradient(circle at 50% 34%,rgba(255,42,74,.5),var(--panel) 74%);width:calc(var(--b,64px)*1.3);height:calc(var(--b,64px)*1.3)}
#bA{border-color:rgba(47,230,255,.7);background:radial-gradient(circle at 50% 34%,rgba(47,230,255,.45),var(--panel) 74%)}
.ab.on{transform:scale(.9);filter:brightness(1.5)}
body.portrait #pad{top:var(--padTop,60%);align-items:center}
body.land #pad{opacity:.78}
.keys{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 11px/1.5 var(--f);letter-spacing:.08em;color:var(--ink-2);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.keys b{color:var(--ink);font-weight:600}
#turn{position:fixed;left:0;right:0;margin:0;text-align:center;font:500 11px/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
/* embedded in the 3D arcade: no page chrome, the matrix fills the frame */
body.embed .bar,body.embed .keys,body.embed #turn{display:none!important}
</style>
</head>
<body>
<canvas id="gl" aria-label="Redline: a Grand Prix racing game on a colour LED dot matrix"></canvas>
<div id="sa"></div>
<div class="bar">
  <span class="brand" id="brand">REDLINE<span>LED MATRIX GRAND PRIX</span></span>
  <div class="opts"><button class="chip" id="res" type="button"><span class="lbl">Dots </span><span id="resv">320×180</span></button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<div id="pad" hidden>
  <div class="stk" id="stL" aria-label="Steering: drag left and right"><div class="kn" id="knL"></div></div>
  <div class="acts"><button class="ab" id="bA" type="button">NITRO</button><button class="ab" id="bB" type="button">BRAKE</button></div>
</div>
<p id="turn" hidden>Turn your phone sideways for a bigger screen</p>
<p class="keys" id="keys"></p>
<div id="err">REDLINE shows its LED matrix through WebGL2, which this browser has turned off.</div>
<script>
(()=>{
'use strict';
/*@@CODE@@*/
})();
</script>
</body>
</html>
