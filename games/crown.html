<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hollow Crown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* =====================================================================================
   THE HOLLOW CROWN: LANTERN OF THE DEEP  -  Hyperdot Arcade cabinet
   A top-down dungeon crawler of light, certainty, and what remains, rebuilt for the LED
   matrix. The game draws a W x H offscreen "matrix" (per-dot lighting with wall shadows,
   region tile art, pixel portraits, bitmap type), then a WebGL2 shader turns every matrix
   pixel into a round glowing dot. All art is code; all sound is synthesized.
   ===================================================================================== */
:root{
  --bg:#06050a;--ink:#efe6d4;--ink-2:#a89c86;--accent:#e8c878;--accent-2:#ff9f42;
  --panel:rgba(16,13,12,.84);--edge:rgba(232,200,120,.18);
  --f:"Chakra Petch","Arial Narrow",system-ui,sans-serif;color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 14px/1 var(--f);letter-spacing:.32em;color:var(--accent);text-shadow:0 0 12px rgba(232,200,120,.5);white-space:nowrap}
.brand span{color:var(--ink-2);letter-spacing:.2em;font-weight:500;font-size:10px;margin-left:8px;text-shadow:none}
@media (max-width:640px){.brand span{display:none}}
@media (max-width:460px){.brand{display:none}#res{display:none}}
@media (max-width:500px){.brand{font-size:12px;letter-spacing:.18em}.opts{gap:5px}.chip{padding:0 8px;font-size:10px;letter-spacing:.05em}.chip .lbl{display:none}}
.opts{display:flex;gap:8px}
.chip{pointer-events:auto;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer;
  font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:focus-visible,.ab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* touch controls: stick on the left; the original six-button grid on the right */
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.stk{pointer-events:auto;touch-action:none;position:relative;flex:none;width:var(--stick,150px);height:var(--stick,150px);border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,200,.05) 0 30%,transparent 31%),var(--panel);border:1px solid var(--edge)}
.kn{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fff0c0,#c49832 62%,#4a3008);box-shadow:0 0 16px rgba(232,180,80,.4)}
.acts{pointer-events:auto;display:grid;grid-template-columns:repeat(2,var(--b,64px));gap:var(--gap,9px)}
.ab{position:relative;overflow:hidden;touch-action:none;cursor:pointer;width:var(--b,64px);height:var(--b,64px);border-radius:10px;border:1px solid var(--edge);color:#e8d8b0;background:var(--panel);
  font:700 11px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;display:grid;place-items:center;padding:0;transition:transform .05s}
.ab.sm{height:calc(var(--b,64px)*.74)}
.ab.wide{width:auto;grid-column:1/span 2}
#bSlash{border-color:rgba(232,200,120,.6);background:radial-gradient(ellipse at 50% 30%,rgba(232,190,100,.45),var(--panel) 75%)}
#bFlare{border-color:rgba(255,159,66,.55);background:radial-gradient(circle at 50% 34%,rgba(255,159,66,.35),var(--panel) 74%)}
#bPulse{border-color:rgba(150,190,230,.5);background:radial-gradient(circle at 50% 34%,rgba(150,190,230,.3),var(--panel) 74%)}
#bDash{border-color:rgba(160,200,215,.45)}
.ab::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.62) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.ab span{position:relative;z-index:1}
.ab.on{transform:scale(.93);filter:brightness(1.5)}
body.portrait #pad{top:var(--padTop,60%);align-items:center}
body.land #pad{opacity:.82}
.keys{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 11px/1.5 var(--f);letter-spacing:.06em;color:var(--ink-2);pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.keys b{color:var(--ink);font-weight:600}
#turn{position:fixed;left:0;right:0;margin:0;text-align:center;font:500 11px/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font:500 14px/1.6 var(--f);color:var(--ink-2)}
body.embed .bar,body.embed .keys,body.embed #turn{display:none!important}
</style>
</head>
<body>
<canvas id="gl" aria-label="The Hollow Crown, an LED matrix dungeon crawler"></canvas>
<div id="sa"></div>
<div class="bar">
  <span class="brand" id="brand">HOLLOW CROWN<span>HYPERDOT ARCADE</span></span>
  <div class="opts"><button class="chip" id="res" type="button"><span class="lbl">Dots </span><span id="resv">320×180</span></button><button class="chip" id="glass" type="button"><span class="lbl">Panel </span><span id="glassv">Color</span></button><button class="chip" id="snd" type="button">Sound on</button><button class="chip" id="sndchk" type="button">Sounds</button><button class="chip" id="pauseBtn" type="button">Pause</button></div>
</div>
<div id="pad" hidden>
  <div class="stk" id="stL" aria-label="Move"><div class="kn" id="knL"></div></div>
  <div class="acts">
    <button class="ab sm" id="bLight" type="button"><span>Light</span></button>
    <button class="ab sm" id="bPulse" type="button"><span>Pulse</span></button>
    <button class="ab" id="bDash" type="button"><span>Dash</span></button>
    <button class="ab" id="bFlare" type="button"><span>Flare</span></button>
    <button class="ab sm wide" id="bUse" type="button"><span id="bUseL">Stair</span></button>
    <button class="ab wide" id="bSlash" type="button"><span>Slash</span></button>
  </div>
</div>
<p id="turn" hidden>Turn your phone sideways for a bigger screen</p>
<p class="keys" id="keys"><b>WASD</b> move · <b>mouse</b> aim · <b>Space</b>/<b>click</b> slash · <b>Shift</b> dash · <b>Q</b> light · <b>F</b>/<b>right-click</b> flare · <b>E</b> pulse · <b>R</b> talk / stairs · <b>Esc</b> pause</p>
<div id="err">This game needs WebGL2, which this browser has turned off.</div>

  const live=k=>sc?pv===k:(active&&!AU.muted&&sndOn('amb:'+k));
  const wg=live('wind')?([.28,.28,.22,.18,.11,.09,.07][reg]||.18):0;
  AU.wind.g.gain.setTargetAtTime(wg*(.45+.55*Math.max(0,Math.sin(tt*.23)*Math.sin(tt*.071+1))),tt,.7);AU.wind.f.frequency.setTargetAtTime(190+80*Math.sin(tt*.13),tt,.6);

function updateLanternMood(){
  if(depth<=1)lanternMood='waking';
  else if(depth===2)lanternMood='curious';
  else if(depth===3)lanternMood='uneasy';
  else if(depth===4)lanternMood='remembering';
  else if(depth===5)lanternMood='afraid';
  else if(depth===6)lanternMood=(story.learnedTruth||story.freedSpirit)?'resolved':'desperate';
}

function snapshotFloorMemory(){
  // Called when descending — capture this floor's state into runMemory
  if(!world)return;
  for(const b of world.braziers){runMemory.braziersTotal++;if(b.lit)runMemory.braziersLit++}
  // Track room clearing
  for(const room of world.rooms){
    if(room.roomType==='antechamber')continue;
    const roomEnemies=world.enemies.filter(e=>{
      const tx=Math.floor(e.x/TILE),ty=Math.floor(e.y/TILE);
      return tx>=room.x&&tx<room.x+room.w&&ty>=room.y&&ty<room.y+room.h;
    });
    const hadEnemies=room._origEnemyCount>0;
    if(hadEnemies&&roomEnemies.length===0&&!runMemory.roomsCleared.includes(room.roomType))runMemory.roomsCleared.push(room.roomType);
    if(hadEnemies&&roomEnemies.length>0&&!runMemory.roomsSkipped.includes(room.roomType))runMemory.roomsSkipped.push(room.roomType);
  }
  for(const s of world.secrets){runMemory.secretsTotal++;if(s.found)runMemory.secretsFound++}
  // Compute dominant light mode
  const total=runMemory.lightModeTime[0]+runMemory.lightModeTime[1]+runMemory.lightModeTime[2];
  if(total>0)runMemory.dominantLightMode=(runMemory.lightModeTime[1]+runMemory.lightModeTime[2]*2)/total;
  runMemory.floorsCompleted++;
}

function applyDungeonMemory(dl){
  // Returns generation modifiers based on how the player has been playing
  const mods={preLitBraziers:0,extraVault:false,desecrated:[],enemyBias:null,extraFuel:0};
  if(runMemory.floorsCompleted===0)return mods;
  // Brazier-heavy play → pre-lit brazier
  if(runMemory.braziersTotal>0&&runMemory.braziersLit/runMemory.braziersTotal>.8)mods.preLitBraziers=1;
  // Bright-heavy → more light-sensitive enemies
  if(runMemory.dominantLightMode>1.5)mods.enemyBias='light_sensitive';
  // Dim-heavy → more darkness stalkers
  if(runMemory.dominantLightMode<.5)mods.enemyBias='dark_stalker';
  // Skipped rooms → desecrated variants
  for(const rt of runMemory.roomsSkipped){if(!mods.desecrated.includes(rt))mods.desecrated.push(rt)}
  // Secret-heavy play → extra vault
  if(runMemory.secretsTotal>0&&runMemory.secretsFound/runMemory.secretsTotal>.7)mods.extraVault=true;
  // High fuel spending → extra fuel pickups
  if(runMemory.fuelSpent>120)mods.extraFuel=2;
  return mods;
}

function idx(x,y){return y*world.w+x}

function carveRect(x,y,w,h){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)setTile(xx,yy,1)}
function carveCircle(cx,cy,r){

function carveWindingCorridor(x1,y1,x2,y2){
  // Create a corridor that wanders slightly
  let cx=x1,cy=y1;

  let phase=Math.random()<.5?'h':'v';

    if(phase==='h'&&cx!==x2){cx+=dx;if(Math.random()<.15&&cy!==y2){setTile(cx,cy,1);cy+=dy;if(Math.random()<.3)phase='v'}}

function roomCenter(r){return{x:Math.floor(r.x+r.w/2),y:Math.floor(r.y+r.h/2)}}
function roomWalkableCenter(r){

  for(let rad=1;rad<=Math.max(r.w,r.h);rad++){
    for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
      if(Math.abs(dx)!==rad&&Math.abs(dy)!==rad)continue;

function generateRoomShape(room){
  const shape=room.shape||'rect';
  if(shape==='rect')carveRect(room.x,room.y,room.w,room.h);
  else if(shape==='circle')carveCircle(Math.floor(room.x+room.w/2),Math.floor(room.y+room.h/2),Math.floor(Math.min(room.w,room.h)/2));
  else if(shape==='ellipse')carveEllipse(Math.floor(room.x+room.w/2),Math.floor(room.y+room.h/2),Math.floor(room.w/2),Math.floor(room.h/2));

function populateRoom(room,dl,isStart,isEnd,mods={}){
  const type=room.roomType;
  const typeDef=ROOM_TYPES[type]||ROOM_TYPES.hall;
  const isDesecrated=room.desecrated||false;
  
  // Decorations based on type
  if(type==='shrine'){
    const c=roomCenter(room);
    if(isWalkable(c.x,c.y)){
      world.decorations.push({kind:isDesecrated?'broken_altar':'altar',x:c.x,y:c.y});
      if(isWalkable(c.x-2,c.y))placeBrazier(c.x-2,c.y,Math.random()<(isDesecrated?.1:.3));
      if(isWalkable(c.x+2,c.y))placeBrazier(c.x+2,c.y,Math.random()<(isDesecrated?.1:.3));
    }
  }else if(type==='cistern'){
    const c=roomCenter(room);
    world.decorations.push({kind:'pool',x:c.x,y:c.y,rx:Math.min(3,Math.floor(room.w/4)),ry:Math.min(2,Math.floor(room.h/4))});
  }else if(type==='gallery'){
    const c=roomCenter(room);
    for(let i=-Math.floor(room.w/4);i<=Math.floor(room.w/4);i+=3){
      const px=c.x+i;
      if(isWalkable(px,c.y-2)&&isOpenArea(px,c.y-2))world.structures.push({kind:'pillar',x:px,y:c.y-2});
      if(isWalkable(px,c.y+2)&&isOpenArea(px,c.y+2))world.structures.push({kind:'pillar',x:px,y:c.y+2});
    }
  }else if(type==='crypt'){
    for(let i=0;i<irand(1,3);i++){
      const p=randomFloorTileInRoom(room);
      if(isOpenArea(p.x,p.y))world.decorations.push({kind:'tomb',x:p.x,y:p.y});
    }
  }
  
  // Braziers
  if(!isStart&&Math.random()<typeDef.brazierChance){
    const p=randomFloorTileInRoom(room);
    if(isOpenArea(p.x,p.y))placeBrazier(p.x,p.y,Math.random()<.16);
  }
  
  // Pickups — desecrated rooms have trapped/reduced loot
  if(!isStart){
    const lootMult=isDesecrated?typeDef.lootMult*.4:typeDef.lootMult;
    const lootRolls=Math.random()<lootMult*.5?2:1;
    for(let i=0;i<lootRolls;i++){
      if(Math.random()<.55*lootMult){
        const p=randomFloorTileInRoom(room);
        placePickup(Math.random()<.7?'fuel':'health',p.x,p.y);
      }
    }
  }
  
  // Secrets
  if(!isStart&&!isEnd&&Math.random()<.45*typeDef.lootMult){
    const p=randomFloorTileInRoom(room);
    placeSecret(Math.random()<.65?'fuel':'relic',p.x,p.y);
  }
  
  // Enemies — desecrated rooms have more, biased by dungeon memory
  if(!isStart&&!isEnd){
    const eMult=isDesecrated?typeDef.enemyMult*1.6:typeDef.enemyMult;
    const enemyCount2=Math.random()<eMult*.6?irand(1,2+(dl>2?1:0)+(isDesecrated?1:0)):0;
    for(let i=0;i<enemyCount2;i++){
      const p=randomFloorTileInRoom(room);
      if(!isOpenArea(p.x,p.y))continue;
      const c=roomCenter(room);
      const sp=world.spawn;
      if(dist(p.x*TILE,p.y*TILE,sp.x,sp.y)<TILE*6)continue;
      const type2=pickEnemyType(dl,mods.enemyBias||null);
      world.enemies.push(createEnemy(type2,p.x*TILE+TILE/2,p.y*TILE+TILE/2));
    }
  }
  
  // Extra pillars for larger rooms
  if(type==='hall'||type==='vault'){
    if(room.w>=10&&room.h>=10&&Math.random()<.5){
      const cc=irand(1,3);
      for(let i=0;i<cc;i++){
        const p=randomFloorTileInRoom(room);
        if(isOpenArea(p.x,p.y))world.structures.push({kind:'pillar',x:p.x,y:p.y});
      }
    }
  }
}

function pickEnemyType(dl,bias=null){
  // Dungeon memory biases still apply
  if(bias==='light_sensitive'){
    if(dl<=3)return Math.random()<.5?'wolf':Math.random()<.8?'moth':'leech';
    return Math.random()<.35?'leech':Math.random()<.6?'moth':Math.random()<.8?'sentinel':'hound';

function generateStandardFloor(dl){
  const mods=applyDungeonMemory(dl);
  const w=88+dl*4,h=88+dl*4;
  world=makeWorld(w,h,REGION_NAMES[dl]);
  for(let i=0;i<world.tiles.length;i++)world.shade[i]=rand(-.14,.17);
  
  let targetRooms=11+dl*3;
  if(mods.extraVault)targetRooms++;
  const rooms=[];const rc=targetRooms;let att=0;
  while(rooms.length<rc&&att<rc*12){
    att++;
    let roomType=assignRoomType(rooms.length,rc,dl);
    // Extra vault from secret-heavy play
    if(mods.extraVault&&rooms.length===rc-2&&!rooms.some(r=>r.roomType==='vault'))roomType='vault';
    const dims=roomDimensions(roomType);
    const rw=dims.w,rh=dims.h;
    const rx=irand(3,w-rw-4),ry=irand(3,h-rh-4);
    if(overlapsRoom(rx,ry,rw,rh,rooms,3))continue;
    const shape=pickRoomShape(roomType);
    const room={x:rx,y:ry,w:rw,h:rh,shape,roomType,desecrated:mods.desecrated.includes(roomType)};
    generateRoomShape(room);
    
    // Connect to previous room with winding corridors
    if(rooms.length){
      const prev=rooms[rooms.length-1];
      const pc=roomWalkableCenter(prev),cc=roomWalkableCenter(room);
      carveWindingCorridor(pc.x,pc.y,cc.x,cc.y);
    }
    rooms.push(room);
  }
  
  // Extra cross-connections for loops
  for(let i=0;i<2+dl;i++){
    const a=rooms[irand(0,rooms.length-1)],b=rooms[irand(0,rooms.length-1)];
    if(a===b)continue;
    const ac=roomWalkableCenter(a),bc=roomWalkableCenter(b);
    carveWindingCorridor(ac.x,ac.y,bc.x,bc.y);
  }
  
  world.rooms=rooms;
  const startRoom=rooms[0],endRoom=rooms[rooms.length-1];
  const sp=roomWalkableCenter(startRoom);world.spawn={x:sp.x*TILE+TILE/2,y:sp.y*TILE+TILE/2};
  const ep=roomWalkableCenter(endRoom);world.exit={x:ep.x*TILE+TILE/2,y:ep.y*TILE+TILE/2,active:true};
  
  // Connectivity verification: BFS from spawn tile to exit tile
  // If disconnected, carve a direct corridor as repair
  {
    const stx=sp.x,sty=sp.y,etx=ep.x,ety=ep.y;
    const sz=world.w*world.h,visited=new Uint8Array(sz);
    const queue=[idx(stx,sty)];visited[idx(stx,sty)]=1;
    let found=false;
    while(queue.length){
      const ci=queue.shift();
      if(ci===idx(etx,ety)){found=true;break}
      const cx2=ci%world.w,cy2=(ci/world.w)|0;
      for(const[ddx,ddy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx2+ddx,ny=cy2+ddy;
        if(!inBounds(nx,ny))continue;
        const ni=idx(nx,ny);
        if(!visited[ni]&&world.tiles[ni]===1){visited[ni]=1;queue.push(ni)}
      }
    }
    if(!found){
      // Spawn and exit are disconnected — carve a direct repair corridor
      carveWindingCorridor(stx,sty,etx,ety);
    }
  }
  
  // Populate each room based on type
  for(let i=0;i<rooms.length;i++){
    populateRoom(rooms[i],dl,i===0,i===rooms.length-1,mods);
    // Track original enemy count for dungeon memory
    const rc2=rooms[i];
    rc2._origEnemyCount=world.enemies.filter(e=>{
      const tx=Math.floor(e.x/TILE),ty=Math.floor(e.y/TILE);
      return tx>=rc2.x&&tx<rc2.x+rc2.w&&ty>=rc2.y&&ty<rc2.y+rc2.h;
    }).length;
  }
  
  // Pre-lit braziers from dungeon memory
  if(mods.preLitBraziers>0){
    const unlitNearSpawn=world.braziers.filter(b=>!b.lit&&dist(b.x,b.y,world.spawn.x,world.spawn.y)<TILE*12);
    unlitNearSpawn.sort((a,b)=>dist(a.x,a.y,world.spawn.x,world.spawn.y)-dist(b.x,b.y,world.spawn.x,world.spawn.y));
    for(let i=0;i<Math.min(mods.preLitBraziers,unlitNearSpawn.length);i++){unlitNearSpawn[i].lit=true;unlitNearSpawn[i].radius=126}
  }
  
  // Extra fuel from high-spending play
  if(mods.extraFuel>0){
    for(let i=0;i<mods.extraFuel;i++){
      const r=rooms[irand(1,rooms.length-2)];
      if(r){const p=randomFloorTileInRoom(r);placePickup('fuel',p.x,p.y)}
    }
  }
  
  // Guarantee at least one relic secret
  const relicRooms=rooms.filter((_,i)=>i>1&&i<rooms.length-1);
  if(relicRooms.length){
    const grRoom=relicRooms[irand(0,relicRooms.length-1)];
    const rp=randomFloorTileInRoom(grRoom);
    placeSecret('relic',rp.x,rp.y,{guaranteed:true});
  }
}

function mutateArena(phase){
  // Phase-driven arena changes
  if(!world||!world._arenaAlcoves)return;
  if(phase===2&&world._arenaPhase<2){
    world._arenaPhase=2;
    // Collapse one alcove — block with rubble
    const alcove=world._arenaAlcoves[irand(0,world._arenaAlcoves.length-1)];
    const cx=alcove.cx,cy=alcove.cy;
    // Fill alcove entrance with walls
    for(let dx=-2;dx<=2;dx++)for(let dy=-1;dy<=1;dy++){
      const tx=cx+dx,ty=cy+dy;
      if(dist(tx,ty,cx,cy)<3&&isWalkable(tx,ty)){
        setTile(tx,ty,0);
        world.decorations.push({kind:'rubble',x:tx,y:ty});
      }
    }
    screenShake=Math.max(screenShake,16);SFX.rumble();
    spawnBurst(cx*TILE+TILE/2,cy*TILE+TILE/2,20,'#c8b898',1.4);
    lanternSpeak('The walls are closing.',true);
  }
  if(phase===3&&world._arenaPhase<3){
    world._arenaPhase=3;
    // Crumble half the pillar ring
    const pillarsToRemove=Math.ceil(world._arenaPillars.length/2);
    for(let i=0;i<pillarsToRemove;i++){
      const pi=world._arenaPillars[i];
      world.structures=world.structures.filter(s=>!(s.x===pi.x&&s.y===pi.y&&s._arenaP));
      world.decorations.push({kind:'rubble',x:pi.x,y:pi.y});
      spawnBurst(pi.x*TILE+TILE/2,pi.y*TILE+TILE/2,8,'#d8cca8',.8);
    }
    screenShake=Math.max(screenShake,20);SFX.rumble();
    lanternSpeak('No more cover. Move.',true);
  }
}


function createEnemy(type,x,y){
  const d=ENEMY_DEFS[type];
  // Scale enemy stats for deeper floors (mild scaling past depth 4)
  const depthScale=depth>4?1+(depth-4)*.12:1;
  const hpScale=type==='witness'?1:depthScale;
  const dmgScale=type==='witness'?1:1+(depth>4?(depth-4)*.06:0);
  return{type,name:d.name,x,y,r:d.r,hp:Math.round(d.hp*hpScale),maxHp:Math.round(d.hp*hpScale),speed:d.speed,
    state:type==='sentinel'?'dormant':'wander',stateTime:rand(1,3),
    path:null,pathTimer:rand(.2,.8),wanderAngle:rand(0,TAU),attackCd:rand(.4,1),

function nearbyEnemies(e,radius){
  const result=[];
  for(const o of world.enemies){if(o===e||o.hp<=0)continue;if(dist(e.x,e.y,o.x,o.y)<=radius)result.push(o)}
  return result;
}

function getMothDrainField(){
  // Check for 2+ moths clustering near the player
  const moths=world.enemies.filter(e=>e.type==='moth'&&e.hp>0&&dist(e.x,e.y,player.x,player.y)<180);
  if(moths.length<2)return null;
  // Check for clusters of 2+ moths within 60px of each other
  for(let i=0;i<moths.length;i++){
    const cluster=[moths[i]];
    for(let j=i+1;j<moths.length;j++){
      if(dist(moths[i].x,moths[i].y,moths[j].x,moths[j].y)<60)cluster.push(moths[j]);
    }
    if(cluster.length>=2)return cluster;
  }
  return null;
}

function getChoirBoost(){
  // Check for choir enemies amplifying nearby enemy senses
  const choirs=world.enemies.filter(e=>e.type==='choir'&&e.hp>0);
  if(!choirs.length)return null;
  return choirs;
}

function updateEcology(dt){
  if(!world||!world.enemies)return;
  
  // Moth drain field effect
  const drainCluster=getMothDrainField();
  if(drainCluster&&dist(drainCluster[0].x,drainCluster[0].y,player.x,player.y)<140){
    // Double drain while in moth cluster field
    player.fuel=Math.max(0,player.fuel-getPlayerLightMode().drain*dt);
    // Mark cluster for rendering
    world._mothDrainField=drainCluster;
  }else{
    world._mothDrainField=null;
  }
  
  // Choir sense amplification
  const choirs=getChoirBoost();
  if(choirs){
    for(const choir of choirs){
      const amplified=nearbyEnemies(choir,120);
      for(const e of amplified){
        if(e.type!=='choir')e._choirBoosted=true;
      }
    }
  }
  
  // Hound drain-field timing: hounds detect drain fields and rush
  if(drainCluster){
    for(const e of world.enemies){
      if(e.type==='hound'&&e.hp>0&&e.state==='wander'&&dist(e.x,e.y,player.x,player.y)<e.sense){
        e.state='chase';e.stateTime=1.5;e.lastKnown={x:player.x,y:player.y};
        e._drainRush=true;
      }
    }
  }
}

function pickFleeTarget(e){
  // Leeches flee toward other enemies instead of just dark corners
  let bestTarget=null,bestScore=-Infinity;
  for(const o of world.enemies){
    if(o===e||o.hp<=0||o.type==='moth'||o.type==='choir')continue;
    const d=dist(e.x,e.y,o.x,o.y);
    if(d>200||d<20)continue;
    const awayFromPlayer=dist(o.x,o.y,player.x,player.y);
    const score=awayFromPlayer-d*.5-getLightLevelAt(o.x,o.y)*120;
    if(score>bestScore){bestScore=score;bestTarget=o}
  }
  return bestTarget;
}

function enemyChoirAI(e,dt,lightHere,dP){
  // Choir orbits at medium range, doesn't attack directly
  // Tries to stay near other enemies to amplify them
  const allies=nearbyEnemies(e,200).filter(a=>a.type!=='choir');
  let targetX,targetY;
  if(allies.length>0){
    // Orbit near allies, biased away from player
    const ally=allies[0];
    const awayAngle=angleTo(player.x,player.y,ally.x,ally.y);
    targetX=ally.x+Math.cos(awayAngle+Math.sin(time*1.5+e.x*.01)*.6)*60;

    targetX=e.x+Math.cos(away)*40;targetY=e.y+Math.sin(away)*40;

    // Wander
    targetX=e.x+Math.cos(e.wanderAngle)*30;targetY=e.y+Math.sin(e.wanderAngle)*30;
    if(Math.random()<dt*.3)e.wanderAngle+=rand(-.8,.8);

}

    if(!isWalkable(nx,ny))continue;const px=nx*TILE+TILE/2,py=ny*TILE+TILE/2;
    const s=dist(px,py,ax,ay)-getLightLevelAt(px,py)*180+rand(-8,8);if(s>bestS){bestS=s;best={x:px,y:py}}}
  return best;

function findPath(sx,sy,tx,ty,maxN=420){
  if(!inBounds(sx,sy)||!inBounds(tx,ty)||!isWalkable(tx,ty))return null;

}

/* =====================================================================================
   LIGHT & SIGHT — every light that matters casts real wall shadows.
   Each source gets a polar depth map: for 720 directions, the distance (world px) a ray travels
   before it enters a wall tile, a pillar or the sealed boss door (a DDA walk over the tile grid).
   The same maps drive (a) what the Warden can see — fog-of-war is now line-of-sight — and
   (b) per-dot lighting in the renderer, so light pools stop at walls and spill down corridors.
   ===================================================================================== */

function castRay(x,y,dx,dy,maxD,pil){

  let mx=dx>0?((tx+1)*TILE-x)/dx:dx<0?(x-tx*TILE)/-dx:1e9,my=dy>0?((ty+1)*TILE-y)/dy:dy<0?(y-ty*TILE)/-dy:1e9;

  for(let guard=0;guard<64;guard++){
    let t;if(mx<my){t=mx;mx+=tdx;tx+=sx;}else{t=my;my+=tdy;ty+=sy;}
    if(t>=maxD)break;
    if(tx<0||ty<0||tx>=world.w||ty>=world.h||world.tiles[ty*world.w+tx]===0){hit=t;break;}
  }
  /* pillars (r 11) and the closed boss door (84 x 32 box) also stop light */
  for(let i=0;i<pil.length;i+=2){const fx=pil[i]-x,fy=pil[i+1]-y,tca=fx*dx+fy*dy;if(tca<0)continue;const d2=fx*fx+fy*fy-tca*tca;if(d2>121)continue;const t0=tca-Math.sqrt(121-d2);if(t0>0&&t0<hit)hit=t0;}

  if(bd&&bd.closed){let t0=-1e9,t1=1e9;
    for(const [o,d,lo,hi] of [[x,dx,bd.x-42,bd.x+42],[y,dy,bd.y-16,bd.y+16]]){if(Math.abs(d)<1e-9){if(o<lo||o>hi){t0=1e9;}continue;}let a=(lo-o)/d,b=(hi-o)/d;if(a>b){const q=a;a=b;b=q;}t0=Math.max(t0,a);t1=Math.min(t1,b);}

const PIL=[];
function buildPolar(x,y,r,out){

function polarFor(o,x,y,r){

/* ---------- DIALOGUE ---------- */
const DLG={t:0,typed:0,sel:-1,lock:0,rects:[],last:-1,ok:false};
function openDialogue(dialogueId){
  const dlg=DIALOGUES[dialogueId];if(!dlg||S.attract)return;
  gameState='dialogue';currentDialogue={id:dialogueId,lineIndex:0,data:dlg};
  DLG.t=0;DLG.typed=0;DLG.lock=.32;DLG.sel=-1;DLG.openN=(DLG.openN||0)+1;duck(.4);enterLine();
}
function enterLine(){
  const dlg=currentDialogue.data;DLG.typed=0;DLG.t=0;
  if(currentDialogue.lineIndex===dlg.lines.length-1){if(dlg.onComplete)dlg.onComplete();DLG.sel=dlg.choices.findIndex(c=>!c.require||c.require.check());if(DLG.sel<0)DLG.sel=0;}
}
function closeDialogue(){gameState='play';currentDialogue=null;duck(1);updateHUD();}
function choiceOK(c){return !c.require||c.require.check();}
/* the original showed a price in red even when you could afford it; say why instead */
function reqWhy(c){const m=/^(\d+) coins$/.exec(c.require.text);if(!m)return 'X '+c.require.text.toUpperCase();
  if(story.coins<+m[1])return 'X '+m[1]+' COINS - YOU HAVE '+story.coins;return /Tonic/.test(c.text)?'VITALITY IS FULL':/Oil/.test(c.text)?'LANTERN IS FULL':'OWNED';}
function pickChoice(c){
  if(!choiceOK(c)){SFX.locked();return;}
  SFX.confirm();
  /* fix: the original always closed after fn(), which instantly hid any dialogue fn() had opened
     (the guardian's retry); and kept playing under the endings. Only close if nothing took over. */
  if(c.action==='close')closeDialogue();
  else if(c.next)openDialogue(c.next);
  else if(c.fn){const before=currentDialogue;c.fn();if(gameState==='dialogue'&&currentDialogue===before)closeDialogue();}
}
function dialogueTick(dt,c,e){
  const cd=currentDialogue;if(!cd)return;const dlg=cd.data,line=dlg.lines[cd.lineIndex],last=cd.lineIndex===dlg.lines.length-1;
  DLG.t+=dt;DLG.lock-=dt;const full=line.text.length,was=Math.floor(DLG.typed);DLG.typed=Math.min(full,DLG.typed+dt*(54));
  if(Math.floor(DLG.typed)!==was&&Math.floor(DLG.typed)%2===0&&line.text[Math.floor(DLG.typed)]!==' ')SFX.blip(PORTRAIT_OF[line.speaker||'']||'glyph');
  if(DLG.lock>0)return;
  const typing=DLG.typed<full;
  /* pointer */
  let clicked=-2;if(PTR.on&&!typing&&last){DLG.hover=-1;for(let i=0;i<DLG.rects.length;i++){const r=DLG.rects[i];if(PTR.x>=r[0]&&PTR.x<r[0]+r[2]&&PTR.y>=r[1]&&PTR.y<r[1]+r[3]){if(INP.aim==='mouse'&&PTR.moved&&DLG.sel!==i){DLG.sel=i;SFX.select();}if(PTR.pressed)clicked=i;}}}
  if(PTR.pressed&&clicked===-2)clicked=-1;
  if(typing){if(e.ok||clicked!==-2)DLG.typed=full;return;}
  if(!last){if(e.ok||clicked!==-2){cd.lineIndex++;enterLine();}return;}
  const n=dlg.choices.length;
  if(e.u){DLG.sel=(DLG.sel-1+n)%n;SFX.select();}if(e.d){DLG.sel=(DLG.sel+1)%n;SFX.select();}
  if(clicked>=0){DLG.sel=clicked;pickChoice(dlg.choices[clicked]);return;}
  if(e.ok&&DLG.sel>=0)pickChoice(dlg.choices[DLG.sel]);
}

  let c=readCtl();
  if(PILOT.on&&(S.attract||PILOT.test)&&!SC.open)c=pilotCtl(dt,c);
  const e=edges(c);E=e;
  if(SC.open){soundCheckTick(dt,c,e);return;}
  if(S.paused){pauseTick(dt,c,e);return;}
  /* message timers run in every state, as in the original */
  if(UI.bT>0&&!(UI.card&&UI.card.t<2.4)){UI.bT-=dt;if(UI.bT<=0)UI.bPri=0;}if(UI.hT>0){UI.hT-=dt;if(UI.hT<=0)UI.hPri=0;}
  if(UI.toast){UI.toast.t+=dt;if(UI.toast.t>3.4)UI.toast=null;}if(UI.card){UI.card.t+=dt;if(UI.card.t>2.8)UI.card=null;}
  switch(gameState){
    case 'prologue':time+=dt;prologueTick(dt,c,e);break;
    case 'play':{
      time+=dt;
      if(S.attract){AT.pt+=dt;if(AT.pt>PANELS[AT.panel]){AT.pt=0;AT.panel=(AT.panel+1)%PANELS.length;}
        if(!PILOT.test&&(e.ok||PTR.pressed&&PTR.touch||(PTR.pressed&&!PTR.touch))){APP_start();return;}
        if(EMBED&&e.back){ARC.exit();}
        demoT+=dt;if(demoT>75){startDemo();return;}}
      else if(e.pause){setPause(true);SFX.select();return;}
      voiceTick(dt);
      if(hitstop>0)hitstop=Math.max(0,hitstop-dt);combatFlash=Math.max(0,combatFlash-dt*4.8);
      const d2=hitstop>0?dt*.12:dt;gameUpdate(d2,c);
      if(S.attract&&player){player.hp=Math.max(player.hp,player.maxHp*.5);player.fuel=Math.max(player.fuel,60);}
      break;}
    case 'dialogue':time+=dt;if(e.pause&&!S.attract){setPause(true);return;}dialogueTick(dt,c,e);break;
    case 'descend':time+=dt;voiceTick(dt);descendTick(dt);break;
    case 'dying':time+=dt;dyingTick(dt);break;
    case 'ending':case 'ending_fight':case 'win':time+=dt;storyTick(dt,c,e);break;
    case 'crash':crashTick(dt,c,e);break;
    case 'results':time+=dt;resultsTick(dt,c,e);break;
    case 'initials':time+=dt;initialsTick(dt,c,e);break;
  }
}
/* ---------- render ---------- */
let lastFrameDt=1/60;
function render(){
  switch(gameState){
    case 'prologue':drawPrologue();break;
    case 'ending':case 'ending_fight':case 'win':drawStory();break;
    case 'crash':drawCrash();break;
    case 'results':drawResults();break;
    case 'initials':drawInitials();break;
    default:
      if(!world||!player){clearB(BLACK);break;}
      if(!(gameState==='descend'&&DS.t>.75&&DS.t<2.1))drawWorld(lastFrameDt);
      if((gameState==='play'||gameState==='descend')&&!S.attract){if(gameState==='play'&&!(UI.card&&UI.card.t<2.3))drawHUD();drawMessages();}
      if(gameState==='dying'){drawHUD();drawDying();}
      if(gameState==='dialogue')drawDialogue();
      if(gameState==='descend')drawDescend();
      if(S.attract)drawAttract();
      if(S.paused)drawPause();
  }
  if(SC.open)drawSoundCheck();
  commit();
}
let ACC=0,LAST=0;
function frame(ts){
  const dt=LAST?Math.min(.05,(ts-LAST)/1000):1/60;LAST=ts;lastFrameDt=dt;
  ACC+=dt;let n=0;while(ACC>=1/60&&n<4){tick(1/60);ACC-=1/60;n++;}if(n===4)ACC=0;
  if(n>0)endInputFrame();
  if(!window.__hdHold){render();present();}
  musicTick(S.paused&&!SC.open);ambience(dt,gameState==='play'||gameState==='dialogue'||gameState==='descend');
  requestAnimationFrame(frame);
}
/* ---------- chrome + boot ---------- */
function toggleSound(){AU.muted=!AU.muted;store.set('hd-mute',AU.muted?'1':'0');setVolume();$('snd').textContent=AU.muted?'Sound off':'Sound on';}
$('snd').addEventListener('click',e=>{audioInit();toggleSound();e.currentTarget.blur();});
$('res').addEventListener('click',e=>{setRes((resI+1)%CAB.res.length);layout();e.currentTarget.blur();});
$('glass').addEventListener('click',e=>{setGlass((glassI+1)%GLASSES.length);e.currentTarget.blur();});
$('sndchk').addEventListener('click',e=>{audioInit();if(SC.open)closeSoundCheck();else{if(gameState==='play'&&!S.attract&&!S.paused)setPause(true);openSoundCheck();}e.currentTarget.blur();});
$('pauseBtn').addEventListener('click',e=>{audioInit();if(S.paused)setPause(false);else if(gameState==='play'&&!S.attract)setPause(true);e.currentTarget.blur();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&gameState==='play'&&!S.attract)setPause(true);});
addEventListener('resize',resize);
if(!gl)$('err').style.display='grid';
if(AU.muted)$('snd').textContent='Sound off';
setGlass(glassI);setRes(resI);resize();APP_attract();
ARC.post('ready',{title:CAB.title,w:W,h:H,tickets:CAB.tickets});
window.__game={get RECT(){return RECT},get W(){return W},get H(){return H},mc,get RBUF(){return RBUF},S,KEY,LATCH,PTR,TS,INP,tick,render,present,
  ff(sec){for(let i=0;i<sec*60;i++)tick(1/60);endInputFrame();},start:APP_start,attract:APP_attract,setRes,setGlass,PILOT,
  get gs(){return gameState},set gs(v){gameState=v},get world(){return world},get player(){return player},get story(){return story},get depth(){return depth},
  get recovered(){return recovered},get UI(){return UI},get DLG(){return DLG},get cur(){return currentDialogue},get RES(){return RES},
  openDialogue,generateFloor,beginDescend,showEnding,spawnHollowKing,grantRelic,resetRun,pickChoice,beginResults,beginCrash,
  get HI(){return HI},AU,SFX_RAW,SOUNDS,scPlay,ambience,SC,SND,openSoundCheck,closeSoundCheck,bfsPath,pilotObjective,worldToTile,createEnemy,flare,pulse,slash,exposeEnemy,cycleLanternMode};
requestAnimationFrame(frame);
})();
